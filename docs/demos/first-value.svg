phs" xml:space="preserve">cat ~/.claude.json ~/.codex/config.toml</text><text x="364.4" y="66" fill="#97A1AD" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc0" >   # two CLIs, two formats</text></g><g class="q1"><text x="20.0" y="88" fill="#97A1AD" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  &quot;github&quot;: { … &quot;GITHUB_TOKEN&quot;: &quot;ghp-…&quot; }   </text><text x="389.6" y="88" fill="#D7DEE4" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Claude Code · JSON</text></g><g class="q2"><text x="20.0" y="110" fill="#97A1AD" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  [mcp_servers.tldraw]                      </text><text x="389.6" y="110" fill="#D7DEE4" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Codex CLI · TOML</text></g><g class="q3"><text x="20.0" y="132" fill="#97A1AD" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  neither knows the other&#x27;s server — and a live token sits in plain JSON</text></g><g class="q4"><text x="20.0" y="154" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q5"><text x="20.0" y="176" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="176" fill="#D7DEE4" clip-path="url(#tc5)" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack init --yes --secrets env</text></g><g class="q6"><text x="20.0" y="198" fill="#97A1AD" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  📥  Imported 2 MCP server(s) from those configs: github · tldraw</text></g><g class="q7"><text x="20.0" y="220" fill="#97A1AD" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  🔐  1 plaintext token lifted to </text><text x="297.2" y="220" fill="#7CC08B" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >${GITHUB_TOKEN}</text><text x="423.2" y="220" fill="#97A1AD" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > → gitignored .env</text></g><g class="q8"><text x="20.0" y="242" fill="#7CC08B" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✅  Wrote .agentstack/agentstack.toml</text><text x="339.2" y="242" fill="#97A1AD" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >   the manifest holds the ${REF}</text></g><g class="q9"><text x="20.0" y="264" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q10"><text x="20.0" y="286" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="286" fill="#D7DEE4" clip-path="url(#tc10)" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack apply --scope global --write</text></g><g class="q11"><text x="20.0" y="308" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="308" fill="#97A1AD" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > wrote 2 server(s) — 2 target(s) in sync</text></g><g class="q12"><text x="20.0" y="330" fill="#97A1AD" textLength="655.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  Claude Code gained &#x27;tldraw&#x27; · Codex gained &#x27;github&#x27; — each in its own syntax</text></g><g class="q13"><text x="20.0" y="352" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q14"><text x="20.0" y="374" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="374" fill="#D7DEE4" clip-path="url(#tc14)" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack doctor</text></g><g class="q15"><text x="20.0" y="396" 