#7CC08B"/><text x="670" y="23" text-anchor="end" fill="#97A1AD" style="font-size:12px;font-weight:700">two half-set-up CLIs → one manifest → served live → files on request → undone</text><g class="q0"><text x="20.0" y="66" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="66" fill="#D7DEE4" clip-path="url(#tc0)" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cat ~/.claude.json ~/.codex/config.toml</text><text x="364.4" y="66" fill="#97A1AD" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc0" >   # two CLIs, two formats</text></g><g class="q1"><text x="20.0" y="88" fill="#97A1AD" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  &quot;github&quot;: { … &quot;GITHUB_TOKEN&quot;: &quot;ghp-…&quot; }   </text><text x="389.6" y="88" fill="#D7DEE4" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Claude Code · JSON</text></g><g class="q2"><text x="20.0" y="110" fill="#97A1AD" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  [mcp_servers.tldraw]                      </text><text x="389.6" y="110" fill="#D7DEE4" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Codex CLI · TOML</text></g><g class="q3"><text x="20.0" y="132" fill="#97A1AD" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  neither knows the other&#x27;s server — and a live token sits in plain JSON</text></g><g class="q4"><text x="20.0" y="154" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q5"><text x="20.0" y="176" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="176" fill="#D7DEE4" clip-path="url(#tc5)" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack init --yes --secrets env</text></g><g class="q6"><text x="20.0" y="198" fill="#97A1AD" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  📥  Importing 2 MCP servers from those configs: github · tldraw</text></g><g class="q7"><text x="20.0" y="220" fill="#97A1AD" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  🔐  1 plaintext token replaced with </text><text x="330.8" y="220" fill="#7CC08B" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >${GITHUB_TOKEN}</text><text x="456.8" y="220" fill="#97A1AD" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > → gitignored .env</text></g><g class="q8"><text x="20.0" y="242" fill="#7CC08B" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✅  Wrote .agentstack/agentstack.toml</text><text x="339.2" y="242" fill="#97A1AD" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >   definitions land in the library</text></g><g class="q9"><text x="20.0" y="264" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q10"><text x="20.0" y="286" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="286" fill="#D7DEE4" clip-path="url(#tc10)" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack x gateway connect --all --write</text><text x="389.6" y="286" fill="#97A1AD" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc10" >   # register the bridge</text></g><g class="q11"><text x="20.0" y="308" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="308" fill="#97A1AD" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > Updated 2 harness configs.</text></g><g class="q12"><text x="20.0" y="330" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="330" fill="#D7DEE4" clip-path="url(#tc12)" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack delivery</text><text x="196.4" y="330" fill="#97A1AD" textLength="462.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc12" >                         # how does each tool get them?</text></g><g class="q13"><text x="20.0" y="352" fill="#97A1AD" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  Claude Code · Codex CLI   </text><text x="255.2" y="352" fill="#7CC08B" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >MCP servers served live</text><text x="448.4" y="352" fill="#97A1AD" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > · house rules to files</text></g><g class="q14"><text x="20.0" y="374" fill="#97A1AD" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  · 0 project artifacts for the capabilities served live</text></g><g class="q15"><text x="20.0" y="396" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q16"><text x="20.0" y="418" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="418" fill="#D7DEE4" clip-path="url(#tc16)" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack doctor</text></g><g class="q17"><text x="20.0" y="440" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="440" fill="#97A1AD" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > 0 errors, 0 warnings.</text><text x="230.0" y="440" fill="#97A1AD" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >   ready: reviewed, activated, verified</text></g><g class="q18"><text x="20.0" y="462" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q19"><text x="20.0" y="484" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="484" fill="#D7DEE4" clip-path="url(#tc19)" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack x delivery render-locally --write</text><text x="406.4" y="484" fill="#97A1AD" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc19" >   # want the files anyway?</text></g><g class="q20"><text x="20.0" y="506" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="506" fill="#D7DEE4" clip-path="url(#tc20)" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack apply --toolset default --scope global --write</text></g><g class="q21"><text x="20.0" y="528" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="528" fill="#97A1AD" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > wrote 2 servers — 2 targets in sync, each in its own syntax</text></g><g class="q22"><text x="20.0" y="550" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q23"><text x="20.0" y="572" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="572" fill="#D7DEE4" clip-path="url(#tc23)" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agentstack restore --last --write</text><text x="314.0" y="572" fill="#97A1AD" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc23" >   # four times: back to the start</text></g><g class="q24"><text x="20.0" y="594" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="594" fill="#97A1AD" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > both native configs byte-identical to where they started</text></g><g class="q25"><text x="20.0" y="616" fill="#7CC08B" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  ✓</text><text x="45.2" y="616" fill="#97A1AD" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > manifest and .env gone — the machine is exactly as it was</text></g><g class="cur"><rect x="536.4" y="603" width="7" height="16" fill="#7CC08B"/></g></svg>