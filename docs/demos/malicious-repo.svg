0{0%,54.6%{opacity:0}54.61%,99.5%{opacity:1}100%{opacity:0}}.q11{opacity:0;animation:q11 13.26s linear infinite}@keyframes q11{0%,57.164%{opacity:0}57.174%,99.5%{opacity:1}100%{opacity:0}}.q12{opacity:0;animation:q12 13.26s linear infinite}@keyframes q12{0%,59.729%{opacity:0}59.739%,99.5%{opacity:1}100%{opacity:0}}.q13{opacity:0;animation:q13 13.26s linear infinite}@keyframes q13{0%,66.516%{opacity:0}66.52600000000001%,99.5%{opacity:1}100%{opacity:0}}.q14{opacity:0;animation:q14 13.26s linear infinite}@keyframes q14{0%,70.287%{opacity:0}70.29700000000001%,99.5%{opacity:1}100%{opacity:0}}.cur{opacity:0;animation:curon 13.26s linear infinite}@keyframes curon{0%,70.287%{opacity:0}70.29700000000001%,99.5%{opacity:1}100%{opacity:0}}.cur>rect{animation:blink 1.1s steps(2,start) infinite}</style><defs><clipPath id="tc0"><rect x="36.8" y="49" width="336.0" height="22" class="w0"/></clipPath></defs><rect x="0.5" y="0.5" width="739" height="399" rx="12" fill="#0E1114" stroke="rgba(255,255,255,0.09)"/><rect x="0.5" y="0.5" width="739" height="38" rx="12" fill="rgba(255,255,255,0.02)"/><rect x="0.5" y="28" width="739" height="10" fill="#0E1114"/><line x1="0.5" y1="38" x2="739.5" y2="38" stroke="rgba(255,255,255,0.07)"/><circle cx="22" cy="19" r="5.5" fill="#E5786B"/><circle cx="40" cy="19" r="5.5" fill="#E0B04A"/><circle cx="58" cy="19" r="5.5" fill="#7CC08B"/><text x="720" y="23" text-anchor="end" fill="#97A1AD" style="font-size:12px;font-weight:700">one hostile repo, three postures: exfiltrated · inert · denied</text><g class="q0"><text x="20.0" y="66" fill="#F0975A" class="p" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$ </text><text x="36.8" y="66" fill="#D7DEE4" clip-path="url(#tc0)" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">examples/malicious-repo-demo/run-demo.sh</text><text x="372.8" y="66" fill="#97A1AD" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="cc0" >   # the same hostile bundle, three ways</text></g><g class="q1"><text x="20.0" y="88" fill="#D7DEE4" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >AgentStack — malicious-repo demo (asserting)</text></g><g class="q2"><text x="20.0" y="110" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q3"><text x="20.0" y="132" fill="#D7DEE4" textLength="445.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >1) Unprotected: a bare harness runs the cloned server</text></g><g class="q4"><text x="20.0" y="154" fill="#7CC08B" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  PASS</text><text x="70.4" y="154" fill="#97A1AD" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > the sink received exfiltrated data — the threat is real</text></g><g class="q5"><text x="20.0" y="176" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q6"><text x="20.0" y="198" fill="#D7DEE4" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >2) AgentStack, not yet trusted: the server is inert</text></g><g class="q7"><text x="20.0" y="220" fill="#7CC08B" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  PASS</text><text x="70.4" y="220" fill="#97A1AD" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > the exfiltrate tool is not exposed while untrusted</text></g><g class="q8"><text x="20.0" y="242" fill="#7CC08B" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  PASS</text><text x="70.4" y="242" fill="#97A1AD" textLength="445.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > the sink stayed empty — the server was never spawned</text></g><g class="q9"><text x="20.0" y="264" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q10"><text x="20.0" y="286" fill="#D7DEE4" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >3) Trusted, but the machine firewall denies the exfil tool</text></g><g class="q11"><text x="20.0" y="308" fill="#7CC08B" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  PASS</text><text x="70.4" y="308" fill="#97A1AD" textLength="529.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > the call was firewalled and written to the audit log as denied</text></g><g class="q12"><text x="20.0" y="330" fill="#7CC08B" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >  PASS</text><text x="70.4" y="330" fill="#97A1AD" textLength="537.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > the sink stayed empty — the exfil call never reached the server</text></g><g class="q13"><text x="20.0" y="352" fill="#D7DEE4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" > </text></g><g class="q14"><text x="20.0" y="374" fill="#D7DEE4" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Summary: </text><text x="95.6" y="374" fill="#7CC08B" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >5 passed</text><text x="162.8" y="374" fill="#D7DEE4" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >, 0 failed</text></g><g class="cur"><rect x="250.8" y="361" width="7" height="16" fill="#7CC08B"/></g></svg>