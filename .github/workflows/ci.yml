name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Resilience against flaky crates.io fetches (e.g. "HTTP2 framing layer"
  # errors on the runner): retry hard, and don't multiplex over HTTP/2.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # `rust-toolchain.toml` at the repo root decides the actual compiler:
      # rustup honors it for every cargo invocation in this checkout, so this
      # step only guarantees a rustup exists. Pinning matters most for `fmt`
      # and `clippy`, whose output moves between releases — a floating stable
      # made "the tree is formatted" a fact about that week's compiler.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `boa_engine` is the workspace's largest dependency (+127 transitive
      # packages, itself not unsafe-free). This gate fails CI when the workflow
      # crate's normal-dependency SET drifts from the blessed snapshot, so a
      # transitive-dependency change is a reviewed event, not a silent one.
      #
      # The snapshot is the sorted, unique set of `name vX.Y.Z` — NOT the raw
      # `cargo tree` output — on purpose: the tree's shape carries the checkout
      # path (root line), ANSI color (CARGO_TERM_COLOR=always above), and
      # host-conditional edges (e.g. `num_threads -> libc` exists on macOS but
      # not Linux). Reducing to the package set strips all three, so the same
      # snapshot verifies on any machine and re-blesses identically. The
      # normalizer below must match the one used to bless.
      #
      # When the set legitimately changes, re-bless it in the SAME PR:
      #   cargo tree -p agentstack-workflow --edges normal --color never \
      #     | sed -E 's/^[^a-zA-Z]*//; s/ \(proc-macro\)//; s/ \(\*\)//; s# \(/.*\)##' \
      #     | grep -v '^agentstack-workflow ' | sort -u > crates/workflow/deps.snapshot
      - name: Workflow crate dependency drift
        run: |
          cargo tree -p agentstack-workflow --edges normal --color never \
            | sed -E 's/^[^a-zA-Z]*//; s/ \(proc-macro\)//; s/ \(\*\)//; s# \(/.*\)##' \
            | grep -v '^agentstack-workflow ' | sort -u > /tmp/workflow-deps.txt
          diff -u crates/workflow/deps.snapshot /tmp/workflow-deps.txt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The default clippy/test above do NOT compile the feature-gated
      # enforcement code (the Docker sandbox backend + the cli sandbox path), so
      # a regression there would otherwise pass CI green. Lint them explicitly.
      - name: Clippy (enforcement features)
        run: |
          cargo clippy -p agentstack-runtime --features docker --all-targets -- -D warnings
          cargo clippy -p agentstack --features sandbox --all-targets -- -D warnings
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: nextest
      # nextest is the repo's preferred runner: process-per-test isolation
      # keeps env-var-mutating integration tests (temp HOME overrides) from
      # interfering, and it's ~3x faster. The workspace has no doctests, so
      # nothing is lost vs `cargo test --all`.
      - name: Test
        run: cargo nextest run --workspace
      - name: Conformance classifier self-test
        run: bash examples/sandbox/conformance-smoke.sh --self-test
      - name: Malicious-repo demo (asserting)
        env:
          AGENTSTACK_BIN: ${{ github.workspace }}/target/release/agentstack
        run: |
          cargo build --release
          bash examples/malicious-repo-demo/run-demo.sh
      # The rest of the asserted example suite — every demo and example
      # project is CI-grade (isolated HOME, PASS/FAIL checks, nonzero exit on
      # failure), so run them all here rather than trusting a manual sweep.
      # The Python MCP clients (lease demo, gateway probe, skills workout) are
      # stdlib-only; the runner's python3 suffices. Reuses the release binary
      # built by the step above.
      - name: Example suite (asserting)
        env:
          AGENTSTACK_BIN: ${{ github.workspace }}/target/release/agentstack
        run: |
          for script in \
            examples/first-value-demo/run-demo.sh \
            examples/everyday-loop-demo/run-demo.sh \
            examples/guard-demo/run-demo.sh \
            examples/one-manifest-demo/run-demo.sh \
            examples/mcp-profile-lease/run-demo.sh \
            examples/projects/multi-cli-webapp/assert.sh \
            examples/projects/per-cli-instructions/assert.sh \
            examples/projects/policy-intersection/assert.sh \
            examples/projects/restricted-folders/assert.sh \
            examples/projects/skills-workout/assert.sh \
            examples/projects/locked-run/assert.sh \
            examples/projects/device-onboarding/assert.sh
          do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done

  # The MSRV is a promise to anyone building from source on an older toolchain,
  # and it is a DIFFERENT number from the pinned development toolchain: this job
  # is what keeps `rust-version` in the workspace Cargo.toml honest. It only
  # checks that the workspace compiles — running the suite is the pinned
  # toolchain's job, and doing it twice buys nothing.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # RUSTUP_TOOLCHAIN outranks `rust-toolchain.toml`, which would otherwise
      # pull in the pinned development compiler and defeat the point of the job.
      - name: Check the workspace on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-targets --locked

  # The flagship security feature — the sandbox + egress proxy + lockdown — only
  # exists behind the `sandbox`/`docker` features and is proven against a real
  # Docker daemon. GitHub's ubuntu runners ship Docker, so run the end-to-end
  # enforcement suite here: a regression that lets a sandboxed container reach a
  # denied host, or that breaks the no-direct-route lockdown, MUST fail CI.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Intentionally floating: `stable` is a branch ref with no resolvable tag.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Sidecar image + policy enforcement (Docker)
        # The sidecar tests are #[ignore]d to keep the default workspace run
        # fast; this dedicated job is where they actually execute.
        run: cargo test -p agentstack-egress --test sidecar_image -- --include-ignored --nocapture
      - name: Sandbox egress + lockdown end-to-end (Docker)
        # `--lib` is load-bearing, not tidiness. Naming `--test` targets
        # explicitly EXCLUDES the lib unit-test target, so the crate's four
        # `#[cfg(feature = "sandbox")]` unit tests were compiled by the clippy
        # step above and executed nowhere — including
        # `tools_execute_is_advertised_only_by_machine_opt_in`, the sole witness
        # that code execution stays behind a machine-level opt-in and that a
        # hostile repository cannot reach dispatch. A security witness that
        # never runs is not a witness.
        run: |
          cargo test -p agentstack --features sandbox \
            --lib \
            --test sandbox_egress \
            --test sandbox_cli_e2e \
            --test sandbox_fs \
            --test sandbox_lockdown \
            --test sandbox_gateway_e2e \
            -- --nocapture

  # Fast, dependency-light gate so a PR that breaks a docs link, drifts the
  # sitemap, or hand-edits generated HTML fails before merge — without waiting
  # on the Rust build. (The browser smoke lives in the docs deploy workflow.)
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Link, fragment, and sitemap check
        run: python3 tools/check-docs-site.py
      - name: Generated pages are in sync with their markdown sources
        run: |
          python3 tools/make-docs-pages.py
          git diff --exit-code docs/

  # Invariant 8 ("claims match enforcement") made mechanical: a PR that changes
  # enforcement BEHAVIOUR in crates/trust, crates/policy or crates/egress must
  # also change docs/ENFORCEMENT.md — where the enforcement claims live — or
  # carry an explicit written waiver. The whole class of defect this defends
  # against is code and documentation disagreeing while nobody notices.
  #
  # pull_request only, on purpose: a push has no dependable base commit to diff
  # against (force-push, squash merge, first push of a branch), and the waiver
  # can live in the PR body, which does not exist on a push. Test-only and
  # comment-only changes in those crates are exempt so the gate does not cry
  # wolf — including tests written as an inline `#[cfg(test)]` item, which is
  # how nearly every test in this repository is written; the checker's docstring
  # explains how that is computed and where it deliberately fails toward firing.
  # Fast and dependency-light, same rationale as docs-checks above.
  enforcement-pairing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The gate diffs base...head, so both sides and their merge base must
          # be present; the default shallow checkout has neither.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checker self-test
        run: python3 tools/check-enforcement-pairing.py --self-test
      - name: Enforcement code and ENFORCEMENT.md change together
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Pass the PR body through a file, never through the shell command
          # line: it is untrusted, attacker-influenced text.
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          python3 tools/check-enforcement-pairing.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --waiver-file /tmp/pr-body.txt

  # Phase 0 structural lint (TODO.md P0.3): every capability kind and policy
  # dimension in the manifest model must have a lock pin, doctor probe,
  # witness test, and ENFORCEMENT.md statement — or a signed-off baseline
  # entry explaining why not. Fast and dependency-light, same rationale as
  # docs-checks above.
  structure-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Manifest kind / policy dimension governance check
        run: python3 tools/check-structure.py
