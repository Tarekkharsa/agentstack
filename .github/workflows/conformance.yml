name: conformance

# Adapter-rot alarm. Nightly (not on PRs): golden snapshots lock what we
# render; this proves the real CLIs on the other end still accept it. A red
# run here means a CLI changed its config schema under us — fix the adapter
# descriptor before users hit it.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Least privilege by default; only `notify` widens, and only to issues.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # Re-run the full suite (incl. golden render snapshots for all 13 adapters)
  # against the latest stable toolchain, independent of push activity.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Intentionally floating: `stable` is a branch ref with no resolvable tag.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test (golden renders + suite)
        run: cargo test --all

  # Install the real, current CLI from its registry and make it read the
  # config agentstack rendered (fenced HOME). Matrix covers the CLIs that are
  # headless-installable; the rest are covered structurally by `render`.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: claude-code
            npm: "@anthropic-ai/claude-code"
            bin: claude
            config: .claude.json
          - adapter: codex
            npm: "@openai/codex"
            bin: codex
            config: .codex/config.toml
          - adapter: gemini
            npm: "@google/gemini-cli"
            bin: gemini
            config: .gemini/settings.json
          - adapter: opencode
            npm: "opencode-ai"
            bin: opencode
            config: .config/opencode/opencode.json
          # pi has no MCP support by design — "-" switches the smoke to its
          # skills-render leg (symlinks under ~/.pi/agent/skills).
          - adapter: pi
            npm: "@mariozechner/pi-coding-agent"
            bin: pi
            config: "-"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Intentionally floating: `stable` is a branch ref with no resolvable tag.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Build agentstack
        run: cargo build --release
      - name: Install ${{ matrix.npm }} (latest)
        run: npm install -g ${{ matrix.npm }}
      # This job installs whatever the registry serves TODAY, so the vendor
      # version is the one variable nobody controls — and it was the one thing
      # no log recorded. Without it, "the nightly went red" cannot be told
      # apart from "the vendor shipped a new CLI last night" without
      # re-running by hand. Never fails the job: this is evidence, not a gate.
      - name: Record installed ${{ matrix.adapter }} version
        run: |
          npm ls -g --depth=0 "${{ matrix.npm }}" || true
          timeout 60 "${{ matrix.bin }}" --version \
            || echo "(${{ matrix.bin }} --version reported nothing)"
      - name: Smoke ${{ matrix.adapter }}
        env:
          AGENTSTACK_BIN: ${{ github.workspace }}/target/release/agentstack
        run: ./examples/sandbox/conformance-smoke.sh ${{ matrix.adapter }} ${{ matrix.bin }} ${{ matrix.config }}

  # Eight consecutive red nights produced nothing but the default failure
  # email, which is easy to stop seeing. This keeps ONE issue as the running
  # record: opened on the first failure, appended to on every later one, so
  # the streak is visible in one place rather than reconstructed from run
  # history. Deliberately not auto-closing on recovery — a human closing it is
  # the acknowledgement that someone looked.
  notify:
    needs: [render, smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly conformance failing"
          # Match the title exactly: `--search` is fuzzy, so filter its result
          # rather than trusting it to have found the right issue.
          num="$(gh issue list --repo "$REPO" --state open --limit 50 \
                   --json number,title \
                   --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$REPO" \
              --body "Still failing: $RUN_URL"
            echo "commented on #$num"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --body "The nightly conformance workflow failed.

          This issue is the running record: it stays open and each further
          failure is appended as a comment. Close it once the cause is fixed.

          First failing run: $RUN_URL"
            echo "opened a new tracking issue"
          fi
