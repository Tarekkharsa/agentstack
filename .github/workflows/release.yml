name: release

# Tag a release: `git tag v0.1.0 && git push --tags`
on:
  push:
    tags: ["v*"]
  # Recovery path for a tag whose build succeeded but whose draft was lost.
  # It checks out and rebuilds the tag; it never publishes automatically.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild into a draft release
        required: true
        type: string

env:
  # On a tag push this is github.ref_name; on a recovery dispatch it is the
  # reviewed existing tag supplied by the maintainer.
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  # Resilience against flaky crates.io fetches on the runners.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          # Published but NOT a supported platform: no CI job runs the suite on
          # Windows and the codebase has almost no Windows-specific handling, so
          # this artifact is untested rather than supported (README and the FAQ
          # say so plainly). It is still built because dropping it would remove
          # the only way anyone can try it and report back — which is the
          # evidence that would justify supporting it.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      # The cross-compiled targets need the standard library for the TARGET
      # installed into the toolchain cargo actually runs, and `rust-toolchain.toml`
      # decides which one that is. Installing the cross std into `stable` while
      # the file redirects cargo to the pinned channel fails as
      # `E0463: can't find crate for core` — and only on the cross targets, so
      # three of five artifacts still build and the release looks half-fine.
      # Read the pin from the file rather than restating it: a second copy of
      # the version is a second thing to forget on a toolchain bump.
      - name: Read the pinned toolchain
        id: pin
        shell: bash
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "building with $channel for ${{ matrix.target }}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --features sandbox --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -e
          name="agentstack-${{ matrix.target }}"
          ext=""
          [[ "${{ matrix.os }}" == windows-latest ]] && ext=".exe"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/agentstack${ext}" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/" 2>/dev/null || true
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentstack-${{ matrix.target }}
          path: |
            agentstack-*.tar.gz
            agentstack-*.zip
          if-no-files-found: error

  release:
    name: publish release
    # Build and attest the sidecar first so its immutable digest is part of the
    # draft at creation time. Updating a draft that points at an existing tag
    # can make GitHub silently replace that tag with an `untagged-*` placeholder.
    needs: [build, egress_image]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Needed for packaging/homebrew/* — this job otherwise only consumes
      # build artifacts and has no working tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # The image job also emits a BuildKit `.dockerbuild` record. It is
          # provenance evidence, not a release archive, and cannot be merged
          # into the binary asset directory.
          pattern: agentstack-*
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: sha256sum agentstack-* > checksums.txt

      # C4a: the tap formula is derived from THIS release's own checksums, so a
      # published formula can never carry a hash someone pasted by hand — the
      # failure mode the checked-in template had (a real-looking file five
      # minor versions stale). Publishing it to the tap repo stays a human
      # step; see RELEASING.md.
      - name: Render the Homebrew formula
        run: |
          set -e
          version="${RELEASE_TAG#v}"
          python3 packaging/homebrew/render-formula.py \
            --version "$version" \
            --checksums assets/checksums.txt \
            --out assets/agentstack.rb

      - name: Attest release binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            assets/agentstack-*.tar.gz
            assets/agentstack-*.zip

      # Create and address the draft by ID. `softprops/action-gh-release` had a
      # tag-discovery race on v0.16.0: it created an `untagged-*` draft, uploaded
      # all seven assets, and reported success. A later release-note patch also
      # replaced the real tag with an `untagged-*` placeholder. The image now
      # finishes first so the complete draft is created once and never patched.
      # A green release job with no release is worse than a hard failure.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.egress_image.outputs.digest }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' crates/cli/Cargo.toml | cut -d'"' -f2)"
          if [ "$RELEASE_TAG" != "v${version}" ]; then
            echo "::error::requested tag $RELEASE_TAG != cli crate version v${version}" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse HEAD)"
          [ -n "$IMAGE_DIGEST" ] || {
            echo "::error::image job returned no immutable digest" >&2
            exit 1
          }
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          notes="Egress proxy image: \`ghcr.io/${owner_lc}/agentstack-egress-proxy@${IMAGE_DIGEST}\`"
          rid="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.draft and .tag_name == \"${RELEASE_TAG}\")][0].id")"
          if [ -z "$rid" ] || [ "$rid" = "null" ]; then
            rid="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${tag_commit}" \
              -f name="${RELEASE_TAG}" \
              -f body="${notes}" \
              -F generate_release_notes=true \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')"
          fi
          [ -n "$rid" ] && [ "$rid" != "null" ] || {
            echo "::error::GitHub did not return a draft release id" >&2
            exit 1
          }
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          echo "draft release id: $rid"

      - name: Upload release assets to the exact draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          # Release asset uploads use uploads.github.com, not api.github.com.
          # Fetching the server-provided URL also keeps this write bound to the
          # exact release ID created or rediscovered above.
          upload_base="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.upload_url | sub("\\{.*$"; "")')"
          for asset in assets/agentstack-*.tar.gz assets/agentstack-*.zip \
                       assets/checksums.txt assets/agentstack.rb; do
            name="${asset##*/}"
            old="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id")"
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old}"
            fi
            curl --fail-with-body --silent --show-error \
              -X POST "${upload_base}?name=${name}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" >/dev/null
          done

          got="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '[.tag_name, .draft, (.assets | length)] | @tsv')"
          expected="${RELEASE_TAG}"$'\t'"true"$'\t'"7"
          if [ "$got" != "$expected" ]; then
            echo "::error::draft verification failed: got '$got', expected '$expected'" >&2
            exit 1
          fi
          echo "draft verified by id: ${RELEASE_ID} (${RELEASE_TAG}, 7 assets)"

  # The egress-proxy sidecar image `--lockdown` needs. The binary's compiled
  # default is this exact GHCR path pinned to its own crate version
  # (crates/cli/src/commands/sandbox.rs), and the runtime pulls it on first
  # use — so lockdown is zero-config with no env var and no extra secrets
  # (GHCR pushes with the built-in token; the package must be made PUBLIC once
  # after the first push — see RELEASING.md). A companion sandbox RUNNER image
  # is intentionally not published: it must carry the user's chosen harness
  # (see docker/sandbox.Dockerfile).
  egress_image:
    name: publish egress-proxy image (GHCR)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write   # push the egress-proxy sidecar image to GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag must match the cli crate version
        # The binary compiled from this tag defaults to
        # ...egress-proxy:v<CARGO_PKG_VERSION>; a mismatched tag would ship
        # binaries pointing at an image this job never publishes.
        run: |
          version="$(grep -m1 '^version' crates/cli/Cargo.toml | cut -d'"' -f2)"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "::error::tag ${RELEASE_TAG} != cli crate version v${version}" >&2
            exit 1
          fi
      - name: Lowercase owner (GHCR requires lowercase paths)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/egress-proxy.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/agentstack-egress-proxy:${{ env.RELEASE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/agentstack-egress-proxy:latest

      - name: Attest egress-proxy image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/agentstack-egress-proxy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
