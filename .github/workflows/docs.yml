name: docs

# Decision, not oversight (TODO.md, 2026-08-02): "the docs site rides with this
# release, not before it" — `main` documents behaviour no installable version
# has, and publishing earlier would describe a product nobody can run. So `push`
# and `pull_request` stay, but they reach `verify` only; `deploy` is gated below
# to `release` (published) and `workflow_dispatch`.
#
# `pull_request` was missing until 2026-08-08, and its absence was the defect:
# `verify` could only ever fail AFTER a merge, so a red docs job sat on `main`
# unnoticed while the PR that caused it showed green — the job structurally
# could not run there. It gates PRs now. `deploy` excludes `pull_request` by
# name (see its `if:`), so gating a PR never publishes one.
#
# `CHANGELOG.md` is in the paths list because it is a real input to the
# generated pages: `tools/make-docs-pages.py` reads it to build the version bar
# on every page, so a CHANGELOG-only commit drifts `docs/` and must be caught by
# the same "generated pages are in sync" step. Measured, not assumed: adding one
# `## vX.Y.Z` heading to CHANGELOG.md and regenerating rewrites 23 pages.
#
# `crates/**` is deliberately absent — a Rust-only change cannot move a
# generated page, and does not earn a browser suite.
#
# KNOWN RESIDUAL, recorded rather than fixed. `make-docs-pages.py` resolves a
# `../` link by testing whether the repo file EXISTS, so DELETING or RENAMING
# one of these turns its link into a raw href, changes the page, and exits 1 —
# with no trigger here: ../README.md, ../STRATEGY.md, ../TODO.md,
# ../examples/{policies,mcp-profile-lease,projects/locked-run}/,
# ../crates/{adapters/descriptors,cli/tests/snapshots},
# ../.github/workflows/conformance.yml. Covering them means listing `crates/**`
# and `examples/**`, which would run the browser suite on every Rust PR — the
# cost this filter exists to avoid. Editing those files is safe; only removing
# or renaming one is not, and a push to `main` still catches it.
on:
  push:
    branches: [main]
    paths:
      ["docs/**", "tools/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  pull_request:
    # No `branches:` filter on purpose: a PR into any base branch — `main` or a
    # release branch — gets the same docs gate. Listing this workflow file makes
    # the trigger self-gating: a PR that edits these checks runs them.
    paths:
      ["docs/**", "tools/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:

# The default for every job. `verify` declares no `permissions:` of its own, so
# it inherits exactly this — read, and nothing else. The Pages credentials are
# declared on `deploy` alone, so no push- or PR-triggered run can hold them.
permissions:
  contents: read

jobs:
  # Gate deployment on the docs regression checks: broken links/fragments,
  # sitemap drift, generated-HTML drift from the markdown sources, and a
  # headless-browser smoke over the key pages at phone + desktop widths.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Link, fragment, and sitemap check
        run: python3 tools/check-docs-site.py
      - name: Generated pages are in sync with their markdown sources
        # If a committed HTML page drifted from its .md source, regenerating
        # produces a diff and this fails — forcing the source+HTML to be
        # committed together.
        run: |
          python3 tools/make-docs-pages.py
          git diff --exit-code docs/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright (library + Chromium)
        # Install the browser driver and axe adapter without creating project
        # package state; `playwright install` fetches Chromium + OS deps.
        run: |
          npm i playwright@1.54.0 @axe-core/playwright@4.10.2 --no-save --no-package-lock
          npx playwright@1.54.0 install --with-deps chromium
      - name: Browser smoke self-test (must catch injected overflow)
        run: SMOKE_SELF_TEST=overflow node tools/site-smoke.mjs
      - name: Browser smoke (real run)
        run: node tools/site-smoke.mjs

  deploy:
    needs: verify
    # Publish with a release, or by hand — never from a push, and never from a
    # pull request. `main` documents behaviour that no installable release
    # carries yet, so an automatic push-to-main deploy would put a page live
    # that describes a build nobody can get (decided 2026-08-02; TODO.md item
    # 12, item 11 when this was written). `verify` above still runs on every
    # push and every PR, so the docs regression checks keep catching drift
    # while the site waits for the release.
    #
    # This allow-list is what keeps that true as triggers are added: it names
    # the two events that MAY publish, so `push` and `pull_request` are
    # excluded by not appearing, not by a rule someone has to remember. Do not
    # rewrite it as a deny-list.
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    # Pages credentials live on this job alone: `verify` never needs them, and
    # a push- or PR-triggered run must not hold a write token for the live
    # site. A fork PR's token is read-only regardless, but the gate here does
    # not depend on that.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Job-scoped, NOT workflow-scoped, so a push- or PR-triggered `verify`
    # cannot queue behind — or cancel — a deployment; it joins no concurrency
    # group at all, and this job is skipped on those events, so it never takes
    # the lock. `cancel-in-progress: false` because interrupting a deploy
    # mid-upload leaves the live site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  # Prove the CDN is serving exactly the bytes we deployed. GitHub Pages serves
  # files verbatim, so the live pages must byte-match the repo's docs/ copy
  # once propagation settles.
  post-deploy-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Live site byte-matches repo docs/
        run: |
          BASE="https://tarekkharsa.github.io/agentstack"
          # Every canonical page, derived from the sitemap so a page added
          # there is automatically covered ("" → index.html, "dir/" →
          # dir/index.html), plus the sitemap itself.
          FILES="$(grep -o '<loc>[^<]*</loc>' docs/sitemap.xml \
            | sed -e 's|<loc>||' -e 's|</loc>||' -e "s|$BASE/||" \
            -e 's|^$|index.html|' -e 's|/$|/index.html|') sitemap.xml"
          mismatched=""
          for f in $FILES; do
            ok=""
            tmp="/tmp/live-$(echo "$f" | tr / _)"
            for attempt in $(seq 1 8); do
              if curl -fsSL "$BASE/$f" -o "$tmp" 2>/dev/null && cmp -s "$tmp" "docs/$f"; then
                ok="yes"
                echo "match: $f (attempt $attempt)"
                break
              fi
              echo "waiting for CDN propagation of $f (attempt $attempt/8)..."
              sleep 15
            done
            if [ -z "$ok" ]; then
              mismatched="$mismatched $f"
            fi
          done
          if [ -n "$mismatched" ]; then
            echo "::error::live site does not match repo docs/ for:$mismatched"
            exit 1
          fi
          echo "all live pages byte-match the repo docs/ copy"
