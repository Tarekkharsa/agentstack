<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AgentStack panel — interactive review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1013; --surface:#14171B; --raise:#1B2027;
  --text:#E9E7E2; --muted:#9AA3AC; --dim:#69727C; --dimmer:#5C646D;
  --line:rgba(233,231,226,.14); --line-soft:rgba(233,231,226,.09);
  --blue:#5B7CFA; --blueSoft:#8DA4FF; --green:#34D399; --amber:#FBBF24; --red:#F87171; --orange:#F0975A;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;text-align:left}
input{font:inherit}
code{font-family:var(--mono);font-size:.92em}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(233,231,226,.14);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse{0%,40%{opacity:1}50%,90%{opacity:.35}100%{opacity:1}}
.pulse{animation:pulse 2s infinite}

/* ── app shell ──────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:280px;flex:none;border-right:1px solid var(--line-soft);background:#101317;display:flex;flex-direction:column}
.rail-top{padding:15px 15px 13px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:9px}
.rail-top .brandrow{display:flex;align-items:center;gap:9px}
.rail-top .title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.rail-top .sub{font-size:11.5px;line-height:1.5;color:#8A929B}
.rail-scroll{flex:1;overflow-y:auto;padding:6px 8px 14px}
.rail h2{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--dim);padding:11px 8px 4px;margin:0}
.rail .item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;width:100%;margin-bottom:1px}
.rail .item:hover{background:rgba(233,231,226,.05)}
.rail .item[aria-current=true]{background:rgba(233,231,226,.08)}
.rail .item .nm{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .item[aria-current=true] .nm{color:var(--text);font-weight:600}
.rail .item .ct{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex:none}
.rail-foot{padding:9px 12px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.rail-foot .kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.modes{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.modes button{flex:1;padding:5px 4px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.modes button[aria-pressed=true]{background:rgba(233,231,226,.09);color:var(--text)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex:none;padding:17px 24px 0;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:13px}
.hdr .r1{display:flex;align-items:flex-start;gap:16px}
.hdr .nm{font-size:18.5px;font-weight:600;letter-spacing:-.015em}
.hdr .summary{font-size:12.5px;line-height:1.55;color:var(--muted);max-width:104ch}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:5px;font-size:10.5px;font-weight:700}
.tag.g{background:rgba(52,211,153,.14);color:var(--green)}
.tag.a{background:rgba(240,151,90,.16);color:var(--orange)}
.tag.r{background:rgba(248,113,113,.16);color:var(--red)}
.tag.b{background:rgba(91,124,250,.16);color:var(--blueSoft)}
.tag.n{background:rgba(233,231,226,.08);color:#C9CDD3}
.toggle{margin-left:auto;display:flex;gap:6px;flex:none}
.toggle button{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;border:1px solid rgba(233,231,226,.1);font-size:11.5px;font-weight:600;color:var(--muted)}
.toggle button[aria-pressed=true]{background:rgba(233,231,226,.1);border-color:rgba(233,231,226,.2);color:var(--text)}
.steps{display:flex;overflow-x:auto}
.steps button{display:flex;align-items:center;gap:9px;padding:9px 14px 11px;border-bottom:2px solid transparent;flex:none}
.steps button[aria-current=true]{border-bottom-color:var(--orange)}
.steps .num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:99px;background:rgba(233,231,226,.06);color:var(--dim);font-family:var(--mono);font-size:10px;font-weight:700}
.steps button[aria-current=true] .num{background:rgba(240,151,90,.18);color:var(--orange)}
.steps .lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.steps button[aria-current=true] .lbl{color:var(--text);font-weight:600}
.steps .done{background:rgba(52,211,153,.16);color:var(--green)}

.body{flex:1;min-height:0;display:flex;overflow:hidden}
.colhead{flex:none;display:flex;align-items:center;gap:9px;padding:10px 20px;border-bottom:1px solid rgba(233,231,226,.07)}
.colhead .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.colhead .v{font-size:11px;color:var(--dimmer)}
.colhead .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dimmer)}
.uicol{flex:none;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-width:0;overflow:hidden}
/* drag handle between the two columns */
.gutter{flex:none;width:9px;margin:0 -4px;cursor:col-resize;position:relative;z-index:3;background:transparent;
  display:flex;align-items:center;justify-content:center}
.gutter::before{content:"";width:1px;height:100%;background:transparent;transition:background .12s}
.gutter::after{content:"";position:absolute;width:3px;height:34px;border-radius:2px;background:rgba(233,231,226,.16);transition:background .12s,height .12s}
.gutter:hover::after,.gutter:focus-visible::after,.gutter.dragging::after{background:var(--orange);height:56px}
.gutter:hover::before,.gutter.dragging::before{background:rgba(240,151,90,.35)}
.gutter:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}

/* ── guide bar: the thing that makes a step a step ────── */
.guide{flex:none;border-bottom:1px solid rgba(233,231,226,.07);background:rgba(240,151,90,.045)}
.guide.done{background:rgba(52,211,153,.05)}
.guide .prog{height:2px;background:rgba(233,231,226,.07)}
.guide .prog i{display:block;height:2px;background:var(--orange);transition:width .25s ease}
.guide.done .prog i{background:var(--green)}
.guide .r{display:flex;align-items:center;gap:11px;padding:9px 20px}
.guide .n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:99px;flex:none;
  background:rgba(240,151,90,.18);color:var(--orange);font-family:var(--mono);font-size:10.5px;font-weight:700}
.guide.done .n{background:rgba(52,211,153,.18);color:var(--green)}
.guide .txt{font-size:12.5px;line-height:1.45;color:#D6DAE0;flex:1;min-width:0}
.guide .txt b{color:var(--text);font-weight:600}
.guide .txt code{background:rgba(233,231,226,.07);border-radius:4px;padding:1px 4px}
.guide .of{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}
.guide .replay{font-size:11px;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 8px;flex:none}
.guide .replay:hover{color:var(--text);background:rgba(233,231,226,.06)}
.guide .changed{display:flex;align-items:flex-start;gap:8px;padding:0 20px 9px;font-size:12px;line-height:1.5;color:var(--green)}
.guide .changed span{color:#A9C9BC}

/* the aim ring on the control that advances the step */
@keyframes aim{0%{box-shadow:0 0 0 0 rgba(240,151,90,.5)}70%{box-shadow:0 0 0 7px rgba(240,151,90,0)}100%{box-shadow:0 0 0 0 rgba(240,151,90,0)}}
.aim{position:relative;outline:1.5px solid var(--orange);outline-offset:2px;border-radius:7px;animation:aim 1.8s infinite}
.aim::after{content:"";position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:99px;background:var(--orange)}
.uistage{flex:1;overflow:auto;padding:22px 20px 30px;display:flex;justify-content:center;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(125,135,150,.035) 9px,rgba(125,135,150,.035) 10px)}
.clicol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cliscroll{flex:1;overflow-y:auto;padding:18px 20px 26px;display:flex;flex-direction:column;gap:16px}

/* ── panel primitives (transcribed from the shipped components) ───── */
.mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#F6B486,#D96E42);flex:none}
.mark.sm{width:16px;height:16px;border-radius:5px}
.pop{width:400px;background:var(--surface);border:1px solid rgba(233,231,226,.16);border-radius:12px;overflow:hidden;
  box-shadow:0 18px 48px -18px rgba(0,0,0,.75);align-self:flex-start}
.dlg{width:100%;max-width:768px;background:var(--surface);border:1px solid rgba(233,231,226,.16);border-radius:12px;
  overflow:hidden;box-shadow:0 18px 48px -18px rgba(0,0,0,.75);align-self:flex-start;display:flex;flex-direction:column}
.dlg.read{max-width:670px}
.p-top{display:flex;align-items:center;gap:8px;padding:13px 15px 9px}
.p-brand{font-size:13.5px;font-weight:600}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;display:inline-block}
.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.m{background:var(--dim)}.dot.g6{background:rgba(52,211,153,.6)}
.p-body{padding:0 10px 10px}
.p-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding:9px 15px}
.p-foot span{font-size:11.5px;color:var(--muted);flex:1}
.dlg-top{display:flex;align-items:center;gap:9px;padding:14px 17px 11px}
.dlg-title{font-size:14.5px;font-weight:600}
.x{margin-left:auto;color:var(--dim);font-size:16px;line-height:1;padding:2px 6px;border-radius:5px}
.x:hover{background:rgba(233,231,226,.07);color:var(--text)}
.box{border:1px solid var(--line);background:rgba(233,231,226,.02);border-radius:9px;padding:10px 12px}
.box.warn{border-color:rgba(251,191,36,.28);background:rgba(251,191,36,.07)}
.box.good{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.06)}
.box.bad{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.box.dash{border-style:dashed;background:transparent}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--muted)}
.t{font-size:13px;font-weight:600;line-height:1.35}
.d{font-size:12px;line-height:1.5;color:var(--muted)}
.xs{font-size:11px;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--mono)}
.dimt{color:var(--dim)}.warnt{color:var(--amber)}.goodt{color:var(--green)}.badt{color:var(--red)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}
.mt6{margin-top:6px}.mt8{margin-top:8px}
.btn{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-weight:600;white-space:nowrap}
.btn:hover{background:rgba(233,231,226,.06)}
.btn.lg{height:28px;padding:0 12px;font-size:12px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#6d8bff}
.btn.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1);color:var(--green)}
.btn.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.15);color:var(--amber)}
.btn.dgr{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1);color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--muted);font-size:11px;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(233,231,226,.07);color:var(--muted)}
.badge.a{background:rgba(251,191,36,.15);color:var(--amber)}
.badge.g{background:rgba(52,211,153,.13);color:var(--green)}
.badge.r{background:rgba(248,113,113,.13);color:var(--red)}
pre.diff{margin:6px 0 0;max-height:118px;overflow:auto;background:#0D1015;border:1px solid var(--line-soft);border-radius:7px;
  padding:8px 9px;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:#C6CFD8;white-space:pre}
pre.diff .add{color:var(--green)}pre.diff .del{color:var(--red)}
.cmd{display:block;background:#0D1015;border:1px solid var(--line-soft);border-radius:6px;padding:6px 8px;
  font-family:var(--mono);font-size:10.5px;color:#CBD5DF;margin-top:5px;overflow-x:auto;white-space:pre}
.tabs{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line)}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected=true]{border-bottom-color:var(--text);color:var(--text);font-weight:600}
.frame{height:520px;overflow:auto}
.frame.split{display:flex;overflow:hidden}
.pane-l{width:264px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.pane-r{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.sect{padding:10px 14px 5px;border-top:1px solid var(--line);margin-top:10px}
.sect.first{border-top:0;margin-top:0}
.hr{border-top:1px solid var(--line-soft);margin-top:9px;padding-top:9px}
.inp{width:100%;background:#0D1015;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11.5px;color:var(--text)}
.inp::placeholder{color:var(--dim)}
.itemrow{display:flex;align-items:flex-start;gap:9px;padding:7px 0}
.itemrow+.itemrow{border-top:1px solid rgba(233,231,226,.05)}
.libremove{opacity:0;transition:opacity .12s}
.itemrow:hover .libremove,.libremove:focus-visible{opacity:1}
.tick{width:15px;height:15px;flex:none;margin-top:2px;border:1.5px solid rgba(233,231,226,.3);border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:transparent}
.tick:hover{border-color:rgba(233,231,226,.6)}
.tick.on{background:var(--green);border-color:var(--green);color:#0E1013;font-weight:700}
.tick[disabled]{opacity:.3;cursor:not-allowed}
details>summary{cursor:pointer;font-size:11px;color:var(--dim);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ "}
details[open]>summary::before{content:"▾ "}
.srcline{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

/* ── terminal ───────────────────────────────────────────── */
.term-wrap{border:1px solid rgba(233,231,226,.12);border-radius:10px;background:#0B0D10;overflow:hidden;flex:none}
.term-top{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid rgba(233,231,226,.08);background:rgba(233,231,226,.02)}
.term-top i{width:8px;height:8px;border-radius:99px;display:block;opacity:.5}
.term-top .cwd{margin-left:6px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}
.term-top .src{margin-left:auto}
.term{padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.62;color:#CFD8E2;white-space:pre-wrap;overflow-x:auto;max-height:340px;overflow-y:auto}
.term .ps{color:var(--orange)}
.term b{color:#fff;font-weight:600}
.term .ok{color:var(--green)}.term .wr{color:var(--amber)}.term .er{color:var(--red)}.term .dm{color:var(--dim)}
.term .cursor{display:inline-block;width:7px;height:12px;background:var(--orange);vertical-align:-2px;animation:pulse 1.1s steps(1) infinite}

/* ── explainer blocks ───────────────────────────────────── */
.sechead{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.how{display:flex;gap:11px}
.how .accent{width:3px;flex:none;border-radius:2px}
.how .ht{font-size:12.5px;font-weight:600}
.how .hx{font-size:12.5px;line-height:1.6;color:var(--muted)}
.gt{display:flex;align-items:flex-start;gap:9px;border-radius:8px;padding:8px 11px;border:1px solid}
.gt.yes{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.05)}
.gt.no{border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.05)}
.gt .m{font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
.gt.yes .m{color:var(--green)}.gt.no .m{color:var(--red)}
.gt .x2{font-size:12px;line-height:1.55;color:#B6BDC5}
.openbox{display:flex;gap:11px;border-left:3px solid var(--red);background:rgba(248,113,113,.05);border-radius:0 7px 7px 0;padding:9px 12px}
.openbox .ot{font-size:12.5px;line-height:1.6;color:#BEC6D0}
.openbox .ot b{color:var(--text)}
.contract{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(233,231,226,.08);padding-top:11px;margin-top:auto}
.contract .k{font-size:10.5px;color:var(--dimmer)}
.contract .v{font-family:var(--mono);font-size:10.5px;color:#8A929B}

/* ── sheet + reference modes ────────────────────────────── */
.scroller{flex:1;overflow-y:auto;padding:22px 24px 40px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
.card{border:1px solid var(--line-soft);border-radius:7px;background:#111419;overflow:hidden;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line-soft)}
.card-h .n{font-family:var(--mono);font-size:10px;font-weight:700;color:#0E1013;background:var(--green);padding:2px 6px;border-radius:3px}
.card-h .n.o{background:var(--orange)}.card-h .n.b{background:var(--blueSoft)}.card-h .n.r{background:var(--red)}.card-h .n.n{background:#C9CDD3}
.card-h .t2{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h .c2{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);flex:none}
.card-b{padding:16px;display:flex;justify-content:center;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(125,135,150,.035) 9px,rgba(125,135,150,.035) 10px)}
.card-b .pop{box-shadow:none}
.card-b .dlg{max-width:none;box-shadow:none}
.card-b .frame{height:auto;max-height:430px}
.card-n{padding:10px 13px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.sheet-h{font-family:var(--serif);font-weight:300;font-size:25px;margin:24px 0 4px}
.sheet-h:first-child{margin-top:0}
.sheet-p{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:84ch}
.frozen{pointer-events:none}
.refhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.refhead input{background:#0D1015;border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:12.5px;color:var(--text);min-width:300px}
.refitem{border:1px solid var(--line-soft);border-radius:8px;background:#111419;overflow:hidden;margin-bottom:10px}
.refitem>summary{display:flex;align-items:center;gap:10px;padding:10px 13px;font-size:12.5px}
.refitem .cmdname{font-family:var(--mono);color:var(--orange)}
.refitem .purpose{color:var(--muted);font-size:11.5px}
.refitem .flag{margin-left:auto}
.refbody{border-top:1px solid var(--line-soft)}

@media(max-width:1280px){ .body{flex-direction:column} .uicol{border-right:0;border-bottom:1px solid var(--line-soft);width:100%!important} .gutter{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <div class="brandrow"><span class="mark"></span><span class="title">The AgentStack panel</span></div>
      <span class="sub">Every scenario, with the panel and the command side by side. The panel is live — do the step and the state really changes. The graphical panel is one host integration today; the CLI is the authority in every one.</span>
      <div class="modes">
        <button data-mode="guided" aria-pressed="true">Guided</button>
        <button data-mode="sheet" aria-pressed="false">All frames</button>
        <button data-mode="ref" aria-pressed="false">CLI</button>
      </div>
    </div>
    <div class="rail-scroll" id="railScroll"></div>
    <div class="rail-foot"><span id="railCount"></span><span class="kbd">← → steps</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   Sources. Panel copy is transcribed from the shipped components —
     t3code apps/web/src/components/agentstack/{AgentstackControl,
     AgentstackDenialCard,BlueprintReviewCard}.tsx + agentstack-logic.ts
   Terminal output is captured from ./target/release/agentstack (0.16.0);
   write commands that could not be run are labelled "reconstructed".
   Guarantees quote the product's own claims; each ✕ is a limit the code
   or docs state explicitly, not an inference.
   ════════════════════════════════════════════════════════════════════ */

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const REF = '$' + '{REF}';
const ref = n => '$' + '{' + n + '}';

/* ── state ───────────────────────────────────────────────────────── */
const base = () => ({
  installed:true, reachable:true, loaded:true, doctorNull:false, incompatible:null,
  setupState:'ready',
  trust:'inert', drift:true, guard:false,
  session:null, activeProfile:null, activeRun:null,
  canSessions:true, canEditProfiles:true, canRestore:true,
  toolsets:[
    {name:'rust',    ready:true,  blocked:null, targets:'claude-code, codex', members:['rust-best-practices','rust-async-patterns','rust-mcp-server-generator']},
    {name:'backend', ready:true,  blocked:null, targets:'claude-code',        members:['github','postgres','sql-review']},
    {name:'review',  ready:false, blocked:'not pinned — run agentstack lock', targets:'claude-code', members:['github','pr-checklist']},
  ],
  manage:null, dialog:null, action:null, flow:null, draft:null, picker:null,
  query:'', undo:{phase:'idle'}, trustAct:null, driftAct:null, setupAct:null,
  secretChoice:1, libRemoved:[], created:false, popover:true,
  // proposal only: the rail carries a selection, so the library always has a
  // destination and never needs a mode
  proposed:false, sel:'backend', menu:null, newRow:null, pending:{add:[],rem:[]},
});
let S = base();
let CUR = {scenario:'ready', step:0, view:'both', mode:'guided', uiPct:46};
let LASTCHANGE = null;   // what the step you just completed actually changed
const DID = new Set();   // steps whose own action you have actually performed

const LIB = {
  skills:[
    {name:'rust-testing',              detail:'Rust testing patterns including unit tests, integration tests and async cases.', origin:'library'},
    {name:'rust-best-practices',       detail:"Guide for writing idiomatic Rust code based on Apollo GraphQL's best practices handbook.", origin:'library', inManifest:true},
    {name:'rust-async-patterns',       detail:'Master Rust async programming with Tokio, async traits and error handling.', origin:'library', inManifest:true},
    {name:'rust-mcp-server-generator', detail:'Generate a complete Rust Model Context Protocol server project.', origin:'library', inManifest:true},
    {name:'pr-checklist',              detail:'Review checklist applied before a pull request is opened.', origin:'project'},
  ],
  servers:[
    {name:'github',   detail:'runs npx -y @modelcontextprotocol/server-github · needs ' + ref('GITHUB_TOKEN'), origin:'library'},
    {name:'postgres', detail:'runs uvx mcp-server-postgres · needs ' + ref('DATABASE_URL'), origin:'library'},
    {name:'figma',    detail:'contacts mcp.figma.com', origin:'library'},
  ],
};

/* selectAgentstackPrimaryConcern — one concern, in this order */
function concern(s){
  if(s.trust==='inert')    return {type:'trust-inert', title:"This project hasn't been reviewed yet",
    detail:'Until you review it, its servers and skills stay inert — nothing it declares can start or reach the network.',
    note:'you approve exact bytes', label:'Review this project', act:'review-trust', others:2};
  if(s.trust==='drifted')  return {type:'trust-drifted', title:'Reviewed content changed on disk',
    detail:'Something this project pinned was edited since you approved it, so it is inert again until you review the new bytes.',
    note:'you approve exact bytes', label:'Review this project', act:'review-trust', others:1};
  if(s.drift)              return {type:'drift', title:'A CLI config was hand-edited',
    detail:'Keep the edit or re-render from the manifest — you choose which truth to keep.',
    note:'reversible · never prunes', label:'Review', act:'review-drift', others:1};
  if(!s.guard)             return {type:'guard-install', title:'Agent commands run without a pre-check',
    detail:"Full-access mode turns off the provider's own approval prompts. The guard puts one back, machine-wide.",
    note:'reversible · only adds protection', label:'Enable guard', act:'action:guard-install', others:0};
  return null;
}
const activeName = s => s.session ? s.session.profile : s.activeProfile;
function healthyLine(s){
  const b=[]; if(s.guard) b.push('guard on'); if(!s.drift) b.push('8 CLIs in sync');
  b.push('secrets resolve','skills installed'); return b.join(' · ');
}
const ACTION_META = {
  'guard-install':{label:'Enable guard', confirm:'Install the pre-tool-use guard into every detected CLI, machine-wide. Only adds protection; reversible with guard uninstall.', done:'guard: enabled — hooks written for 8 CLI(s)'},
  'adopt-project':{label:'Keep edits',   confirm:"Pull the on-disk hand-edits into this project's manifest. Only writes agentstack.toml — never rewrites or removes anything in a CLI's own config.", done:'adopted 2 change(s) into .agentstack/agentstack.toml'},
  'apply-project':{label:'Re-render',    confirm:"Re-render this project's CLI config from the manifest. Overwrites hand-edits; keeps servers other setups applied and never prunes. Reversible with agentstack restore.", done:'re-rendered 1 target from the manifest'},
};

/* ── one toolset, described one way ─────────────────────────────────
   Every surface that shows a toolset uses these two. The summary is derived
   from the members, so a row can never claim a count its own member list
   contradicts — which is exactly what three hand-written literals did. */
const isServer = n => LIB.servers.some(x=>x.name===n);
function summarizeToolset(t){
  const sv=t.members.filter(isServer).length, sk=t.members.length-sv;
  const bits=[];
  if(sv) bits.push(sv+' server'+(sv>1?'s':''));
  if(sk) bits.push(sk+' skill'+(sk>1?'s':''));
  if(!bits.length) bits.push('nothing in it yet');
  if(t.targets) bits.push('for '+t.targets);
  return bits.join(' · ');
}
/* opts.faithful reproduces the shipped rail's two bugs (see the Use-a-toolset
   finding); the proposal passes it off, which is the fix. */
function toolsetRow(s,t,o){
  o=o||{};
  const held = !!(s.session && s.session.profile===t.name);
  const active = s.activeProfile===t.name;
  const inUse = o.faithful ? (active||held) : held;
  const sel = o.selectable && !s.newRow && s.sel===t.name;
  const age = (o.faithful ? (inUse&&s.session) : held) ? ' · in use '+s.session.ago : '';
  const tag = o.selectable
    ? `${held?'<span class="badge g">in use</span>':''}${sel?'<span class="badge" style="background:rgba(91,124,250,.18);color:var(--blueSoft)">editing</span>':''}`
    : (inUse&&s.canSessions ? btn('Stop','stop')
       : (t.ready&&!s.session&&s.canSessions ? btn('Use','use:'+t.name,'','title="Use this toolset temporarily — ends with your files back as they were"') : ''));
  const body = `<div class="row g8">${dot(inUse?'':(t.ready?'g6':'a'))}
      <span class="xs" style="color:var(--text);font-weight:600;flex:1">${esc(t.name)}</span>${tag}</div>
    <span class="srcline">${esc(summarizeToolset(t))}${age}</span>
    ${t.blocked?`<span class="xs warnt">${esc(t.blocked)}</span>`:''}
    ${t.members.length?`<span class="srcline">${t.members.map(esc).join(' · ')}</span>`:''}`;
  const style = sel ? 'border-color:rgba(91,124,250,.45);background:rgba(91,124,250,.08)'
              : inUse ? 'border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)' : '';
  return o.selectable
    ? `<button class="box col g4" data-act="sel:${t.name}" style="width:100%;text-align:left;${style}">${body}</button>`
    : `<div class="box col g4" style="${style}">${body}</div>`;
}

const btn=(l,a,c='',x='')=>`<button class="btn ${c}" data-act="${a}" ${x}>${l}</button>`;
const dot=k=>`<span class="dot ${k||''}"></span>`;

/* ══ GLANCE ═════════════════════════════════════════════════════════ */
function viewGlance(s){
  const c=concern(s);
  if(!s.reachable) return shell(`<p class="d" style="padding:4px 5px 10px">Couldn't check status — the t3code server didn't answer.</p>`,'',s,{bare:true});
  if(!s.loaded)    return shell(`<p class="d" style="padding:4px 5px 10px">Checking…</p>`,'',s,{bare:true});
  if(!s.installed) return shell(`<div class="col g8" style="padding:2px 5px 10px">
      <p class="t">AgentStack isn't installed</p>
      <p class="d">The <code>agentstack</code> CLI isn't reachable on the machine running this project, so its sessions run ungoverned. It's a local binary — install it to get trust-gated MCP servers, a pre-tool-use guard, and a per-project audit log.</p>
      <p class="xs"><b style="color:var(--text)">Install</b> — Build or download it from <code>github.com/Tarekkharsa/agentstack</code>, then put <code>agentstack</code> on your <code>PATH</code>.</p>
      <p class="xs"><b style="color:var(--text)">Already installed?</b> If <code>agentstack</code> is a shell function or lives off <code>PATH</code> (so a packaged/Finder-launched app can't see it), point the server at the binary:</p>
      <code class="cmd">T3CODE_AGENTSTACK_BIN=/path/to/agentstack</code>
      <div class="row g8 mt6">${btn('Check again','recheck')}<span class="xs dimt">Re-checks automatically every few seconds, too.</span></div>
    </div>`,'',s,{bare:true});
  if(s.incompatible) return shell(`<div class="col g6" style="padding:2px 5px 10px">
      <p class="t">Update t3code to continue</p>
      <p class="d">This project's <code>agentstack</code> CLI (v0.17.0) speaks a newer data format (schema 4) than this t3code build understands (schema 3). Update t3code to read this AgentStack CLI — until then, the panel's actions are disabled to avoid acting on data it can't fully read.</p>
    </div>`,'',s,{bare:true});
  if(s.doctorNull) return shell(`<div class="col g8" style="padding:2px 5px 10px">
      <p class="t">Couldn't read the status</p>
      <p class="d">agentstack is installed, but <code>doctor</code> returned no readable report for this project. That is usually momentary — a status read that landed while agentstack was writing. Any change you just made has still been applied.</p>
      <div class="row g8">${btn('Check again','recheck')}<span class="xs dimt">Re-checks automatically every few seconds, too.</span></div>
      <p class="xs dimt">If it persists, <code>agentstack doctor</code> in a terminal shows the underlying error.</p>
    </div>`,'',s,{bare:true});
  if(s.setupState==='needs_setup') return shell(`<div class="col g8" style="padding:2px 5px 10px">
      <p class="t">This project isn't set up yet</p>
      <p class="d">AgentStack can import the coding tools already on this machine into one manifest your CLIs render from. You'll see exactly what it would write before anything is written.</p>
      ${btn('Review setup','open:setup','pri lg')}
    </div>`,'',s,{bare:true});

  let body;
  if(c){
    body = `<div class="box warn col g8">
      <span class="t">${esc(c.title)}</span>
      <span class="d">${esc(c.detail)}</span>
      <div class="row g10">${btn(esc(c.label),'concern','pri')}<span class="xs dimt">${esc(c.note)}</span></div>
    </div>`;
  } else {
    const a=activeName(s);
    if(a){
      const row=s.toolsets.find(t=>t.name===a);
      body = `<div class="box col g8"><span class="cap">WORKING UNDER</span>
        <div class="row g8"><span style="font-size:14px;font-weight:600;flex:1">${esc(a)}</span>
          ${s.session&&s.canSessions?btn('Stop using','stop'):''}${btn('Switch','manage:toolsets')}</div>
        <span class="xs">${esc(row?summarizeToolset(row):'applied to this project')}${s.session?` · in use ${s.session.ago}`:''}</span></div>`;
    } else {
      body = `<div class="box col g8"><span class="d">${s.toolsets.length?'No toolset is active. Pick one to apply it here.':'No toolsets yet — bundle the tools this project needs into one.'}</span>
        ${btn(s.toolsets.length?'Choose':'Create one','manage:toolsets')}</div>`;
    }
  }
  if(s.action) body += actionConfirm(s.action);
  const foot = c ? (c.others>0?`${c.others} more finding${c.others>1?'s':''} in Manage`:'Nothing else needs you.')
                 : (healthyLine(s)||'This project is set up and in sync.');
  return shell(body,foot,s,{});
}
function shell(body,foot,s,o){
  const c=concern(s);
  const chip=(o.bare||!s.installed)?'':`<span class="chip">${dot(c?'a':'')}${c?'Needs you':'Ready'}</span>`;
  const strip=s.activeRun?`<button class="box warn row g8" data-act="open:monitor" style="margin:0 12px 10px;width:calc(100% - 24px)">
      <span class="dot a pulse"></span>
      <span class="xs" style="color:var(--text)"><b>${esc(s.activeRun.workflow)}</b> running · ${s.activeRun.running} active</span>
      <span class="xs warnt" style="margin-left:auto;font-weight:600">View agents →</span></button>`:'';
  return `<div class="pop">
    <div class="p-top"><span class="mark"></span><span class="p-brand">AgentStack</span>${chip}</div>
    ${strip}<div class="p-body">${body}</div>
    ${foot!==''?`<div class="p-foot"><span>${esc(foot)}</span>${btn('Manage ›','manage:setup','ghost')}</div>`:''}
  </div>`;
}
function actionConfirm(a){
  const m=ACTION_META[a.kind]||{label:'Run',confirm:''};
  if(a.phase==='done') return `<div class="box ${a.ok?'good':'bad'} mt8 row g8">
    <span class="xs"><b class="${a.ok?'goodt':'badt'}">${a.ok?'Done':'Failed'}</b> — <span class="mono">${esc(a.message)}</span></span>
    <button class="link" data-act="act:dismiss" style="margin-left:auto">dismiss</button></div>`;
  return `<div class="box warn mt8 col g8"><span class="xs">${esc(m.confirm)}</span>
    <div class="row g8">${btn(a.phase==='running'?'Running…':'Run '+m.label.toLowerCase(),'act:run','warn',a.phase==='running'?'disabled':'')}${btn('Cancel','act:cancel','ghost')}</div></div>`;
}

/* ══ MANAGE ═════════════════════════════════════════════════════════ */
const TABS=[['setup','Setup'],['toolsets','Toolsets'],['protection','Protection'],['activity','Activity']];
function viewManage(s){
  const t=s.manage;
  const body=t==='setup'?tabSetup(s):t==='toolsets'?(s.proposed?tabToolsetsProposed(s):tabToolsets(s)):t==='protection'?tabProtection(s):tabActivity(s);
  return `<div class="dlg">
    <div class="dlg-top"><span class="mark sm"></span><span class="dlg-title">Manage AgentStack</span><button class="x" data-act="close">✕</button></div>
    <div class="tabs">${TABS.map(([id,l])=>`<button data-act="manage:${id}" aria-selected="${t===id}">${l}${id==='activity'&&s.activeRun?' <span class="badge a">run live</span>':''}</button>`).join('')}
      <span style="margin-left:auto;padding-right:10px" class="srcline">v0.16.0</span></div>
    <div class="frame ${t==='toolsets'?'split':''}">${body}</div></div>`;
}
function tabSetup(s){
  const c=concern(s);
  const chipLabel=s.setupState==='needs_setup'?'Needs setup':c?'Needs attention':s.guard?'Protected':'Ready';
  const rows=[];
  if(s.trust!=='trusted') rows.push({d:'a',label:'Trust',line:'this project is inert until reviewed',act:'concern',verb:'Review this project'});
  if(s.drift)  rows.push({d:'a',label:'Claude Code',line:'no longer matches what agentstack last wrote',act:'open:drift',verb:'Review'});
  if(!s.guard) rows.push({d:'a',label:'Guard',line:'not enabled — Full-access mode disables the providers’ own approval prompts',act:'act:start:guard-install',verb:'Enable guard'});
  const findings=[
    ['Claude Desktop config present but binary not on PATH','—'],
    ['Codex CLI would REMOVE 10 server(s) that came from another setup','agentstack adopt --scope global'],
    ['guard not enabled — agent sessions run with no pre-tool-use gate','agentstack guard install'],
  ];
  return `<div style="padding:14px 16px 16px" class="col g10">
    <div class="row g8"><span class="badge ${c?'a':'g'}">${chipLabel}</span><span class="xs dimt">deriveAgentstackStatusChip</span></div>
    ${rows.map(r=>`<div class="row g8">${dot(r.d)}
      <div class="col" style="flex:1"><span class="xs dimt">${esc(r.label)}</span><span class="d" style="color:var(--text)">${esc(r.line)}</span></div>
      ${btn(esc(r.verb),r.act)}</div>`).join('')}
    <div class="hr col g6"><span class="xs" style="color:var(--text);font-weight:600">What the checkup found <span class="dimt" style="font-weight:400">${findings.length} findings, open by default</span></span>
      ${findings.map(([m,f])=>`<div style="padding-left:10px;border-left:1px solid var(--line-soft)" class="col">
        <span class="xs" style="color:var(--text)">${esc(m)}</span><span class="srcline">${esc(f)}</span></div>`).join('')}</div>
    <div class="row g8"><span class="dot g6"></span><span class="xs">${esc(healthyLine(s))}</span></div>
    ${s.action?actionConfirm(s.action):''}
    ${undoView(s)}
    <div class="hr row g8">${btn('Check again','recheck')}${btn('Open manifest','noop')}
      <span class="xs dimt">re-runs the same checks as <code>agentstack doctor</code></span></div></div>`;
}
function undoView(s){
  const u=s.undo;
  if(!s.canRestore) return `<p class="xs dimt">Undo isn't available on this agentstack CLI — update it to revert managed changes.</p>`;
  if(u.phase==='idle')    return `<div>${btn('Undo last change…','undo:reveal')}</div>`;
  if(u.phase==='loading') return `<p class="xs dimt">Checking recent changes…</p>`;
  if(u.phase==='empty')   return `<p class="xs dimt">Nothing to undo — no recorded change touches this project.</p>`;
  const line=`Undo <b style="color:var(--text)">apply · 8 files · Claude Code, Codex CLI, Gemini CLI</b> · 3h ago`;
  if(u.phase==='ready')   return `<div class="col g6"><span class="xs">${line}</span><div><button class="link warnt" data-act="undo:ask">Undo this change</button></div></div>`;
  if(u.phase==='confirm') return `<div class="col g6"><span class="xs">${line}</span>
      <div class="row g8">${btn('Undo this change','undo:run','warn')}${btn('Cancel','undo:cancel','ghost')}</div></div>`;
  return `<div class="box good"><span class="xs"><b class="goodt">Undone</b> — <span class="mono">restored 8 file(s) from 18c67c10</span></span></div>`;
}
function tabToolsets(s){
  return `${railView(s)}${s.canEditProfiles?libraryView(s):
    `<div class="pane-r" style="padding:14px"><p class="d">This agentstack CLI predates the library browser. Update it to add tools to a toolset from here.</p></div>`}`;
}
function railView(s){
  const d=s.draft; let cards='';
  if(d){
    const ok=/^[A-Za-z0-9._-]+$/.test(d.name.trim());
    cards+=`<div class="box good col g6" style="margin-bottom:6px">
      <input class="inp" placeholder="Name it, e.g. web" value="${esc(d.name)}" data-input="draftname">
      <span class="xs">${d.picked.length===0?'Now click tools in the library to add them.':`${d.picked.length} tool${d.picked.length>1?'s':''} picked.`}</span>
      ${d.name.trim()!==''&&!ok?`<span class="xs warnt">Letters, numbers, dot, dash or underscore — no spaces.</span>`:''}
      <div class="row g8">${btn('Create','draft:create','ok',(!ok||d.picked.length===0)?'disabled':'')}<button class="link" data-act="draft:cancel">Cancel</button></div></div>`;
  }
  if(s.toolsets.length===0&&!d) cards+=`<div class="box dash col g6"><span class="t">No toolsets yet</span>
    <span class="xs">A toolset bundles the servers and skills one kind of work needs. Nothing in the library can be added until there's one to add it to.</span>
    ${btn('Create the first one','draft:new')}</div>`;
  // faithful: keeps the shipped rail's Stop-without-a-session and leaking
  // "in use" age, because both are findings on this scenario.
  cards+=s.toolsets.map(t=>toolsetRow(s,t,{faithful:true})).join('');
  return `<div class="pane-l">
    <div class="row g8" style="padding:12px 12px 6px"><span class="cap">TOOLSETS</span>
      ${s.canEditProfiles&&!d&&s.toolsets.length>0?`<span style="margin-left:auto">${btn('+ New','draft:new')}</span>`:''}</div>
    <div class="col g6" style="padding:0 8px 12px">${cards}</div></div>`;
}
function libraryView(s){
  const q=s.query.toLowerCase();
  const match=i=>!q||i.name.toLowerCase().includes(q)||(i.detail||'').toLowerCase().includes(q);
  const group=(title,items,kind)=>{
    const list=items.filter(i=>!s.libRemoved.includes(i.name)).filter(match);
    return `<div class="col g6" style="margin-bottom:10px"><span class="xs" style="color:var(--text);font-weight:600">${title}</span>
      ${list.length===0?`<span class="xs dimt">${q?`No ${kind}s match.`:`No ${kind}s in the library yet.`}</span>`:list.map(i=>libRow(s,i,kind)).join('')}</div>`;
  };
  return `<div class="pane-r">
    <div class="row g8" style="padding:12px 14px 8px">
      ${s.draft?`<span class="badge g">Adding to ${esc(s.draft.name.trim()||'new toolset')}</span>`:`<span class="cap">LIBRARY</span>`}
      <span style="margin-left:auto;width:190px"><input class="inp" placeholder="Filter skills and servers…" value="${esc(s.query)}" data-input="query"></span></div>
    <div style="padding:0 14px 12px">${group('Skills',LIB.skills,'skill')}${group('Servers',LIB.servers,'server')}</div>
    ${s.flow?flowCard(s):''}</div>`;
}
function libRow(s,i,kind){
  const picked=s.draft&&s.draft.picked.includes(i.name);
  let right;
  if(s.draft) right=btn(picked?'Added':'Add','draft:pick:'+i.name,picked?'ok':'');
  else if(s.picker===i.name) right=btn('Cancel','picker:close','ghost');
  else right=btn('Add','picker:'+i.name,'',s.toolsets.length===0?'disabled title="Create a toolset first, then add tools to it"':'title="Add this to a toolset"');
  const removable=i.origin==='library'&&!s.draft&&!s.flow;
  return `<div class="itemrow">${dot(picked?'':'m')}
    <div class="col" style="flex:1;min-width:0">
      <span class="xs" style="color:var(--text);font-weight:600">${esc(i.name)}${i.inManifest?' <span class="dimt" style="font-weight:400">in project</span>':''}</span>
      ${i.detail?`<span class="srcline">${esc(i.detail)}</span>`:''}

function flowCard(s){
  const f=s.flow, head=`<span class="t">${esc(f.title)}</span>`; let body='';
  if(f.phase==='previewing') body=`<span class="xs dimt">Preparing "${esc(f.title)}"…</span>`;
  else if(f.phase==='unsupported') body=`<span class="xs warnt">This agentstack CLI's preview has no digest to confirm against, so this change can't be applied from here. Update agentstack, or make the change in a terminal.</span>
    <div><button class="link" data-act="flow:close">← Back to library</button></div>`;
  else if(f.phase==='confirm'||f.phase==='running'){
    body = f.kind==='batch'
      ? `<span class="xs">${f.add.length?`Adds <b style="color:var(--text)">${f.add.map(esc).join(', ')}</b>. `:''}${f.rem.length?`Takes out <b style="color:var(--text)">${f.rem.map(esc).join(', ')}</b>. `:''}One re-lock and one render for the whole change — items taken out stay in your library.</span>
         <details><summary>Details</summary><span class="srcline">change sha256:a71f0c93…4d80</span></details>
         <div class="row g8">${btn(f.phase==='running'?'Applying…':'Confirm','flow:confirm','ok')}${btn('Cancel','flow:close','ghost')}</div>`
      : f.kind==='unadd'
      ? `<span class="xs">Takes it out of this toolset, in this project. It stays in your library and in every other toolset that uses it.</span>
         <details><summary>Details</summary><span class="srcline">change sha256:c41b09aa…7e12</span></details>
         <div class="row g8">${btn('Remove','flow:confirm','ok')}${btn('Cancel','flow:close','ghost')}</div>`
      : f.kind==='remove'
      ? (()=>{ // RemovalConfirmBody: the warning box appears only when this
                // project actually references it (removal.used_by_this_project)
          const used = s.toolsets.filter(t=>t.members.includes(f.name)).map(t=>t.name);
          return `<span class="xs">This removes it from your library on this machine — every project that uses it by name is affected. Nothing in this project's files changes right now.</span>
         ${used.length?`<div class="box warn"><span class="xs"><b class="warnt">This project uses it</b> — toolset${used.length>1?'s':''} ${used.map(esc).join(', ')}. Activating that toolset again will fail until you re-add or restore it.</span></div>`:''}
         <span class="xs">It moves to the library trash, so you can put it back:</span>
         <code class="cmd">agentstack lib trash --restore ${esc(f.name)} --write</code>
         <div class="row g8">${btn(f.phase==='running'?'Removing…':'Remove','flow:confirm','dgr')}${btn('Cancel','flow:close','ghost')}</div>`;})()
      : `<span class="xs">Applying re-locks and re-renders the toolset. An unresolved <code>${esc(REF)}</code> secret blocks the render (set it, then re-apply) — nothing is written until you confirm.</span>
         <details><summary>Details</summary><span class="srcline">change sha256:5f0afa8f…c31d</span></details>
         <div class="row g8">${btn(f.phase==='running'?'Applying…':'Confirm','flow:confirm','ok')}${btn('Cancel','flow:close','ghost')}</div>`;
  }
  else if(f.phase==='done'&&f.secretBlocked) body=`<span class="xs" style="color:var(--text);font-weight:600">Set a secret to finish</span>
    <span class="xs">The toolset was written, but a value it needs isn't set yet, so AgentStack kept the <code>${esc(ref('GITHUB_TOKEN'))}</code> placeholder and didn't render the config — nothing leaked.</span>
    <span class="xs">Set it, then activate the toolset:</span><code class="cmd">agentstack secret set GITHUB_TOKEN</code>
    <div><button class="link" data-act="flow:close">← Back to library</button></div>`;
  else body=`<span class="xs"><b class="${f.ok?'goodt':'badt'}">${f.ok?'Done':"Couldn't apply"}</b> — <span class="mono">${esc(f.message)}</span></span>
    <div><button class="link" data-act="flow:close">← Back to library</button></div>`;
  return `<div style="border-top:1px solid var(--line);padding:11px 14px;max-height:236px;overflow:auto">
    <div class="box ${f.phase==='done'&&f.secretBlocked?'warn':''} col g6">${head}${body}</div></div>`;
}
/* ══ PROPOSAL ═══════════════════════════════════════════════════════
   One change carries the rest: the rail row is a selection, so the library
   always has a destination. That kills the mode ("composing"), the deferred
   picker ("Add to …"), and the asymmetry (add here, but un-add elsewhere).
   Membership becomes state on the row, so one verb per row is enough, and
   the machine-wide delete moves out of the row into an overflow. */
function tabToolsetsProposed(s){
  const target = s.newRow || s.toolsets.find(t=>t.name===s.sel);
  const name   = target ? target.name : null;
  const base   = target ? target.members : [];
  const pend   = s.pending || {add:[],rem:[]};
  const inSet  = n => (base.includes(n) && !pend.rem.includes(n)) || pend.add.includes(n);
  const count  = pend.add.length + pend.rem.length;

  const newRow = s.newRow ? `<div class="box col g6" style="border-color:rgba(91,124,250,.45);background:rgba(91,124,250,.08)">
      <span class="cap">NEW TOOLSET</span>
      <input class="inp" placeholder="Name it, e.g. web" value="${esc(s.newRow.name)}" data-input="newname">
      <button class="link" data-act="p:cancel">Cancel</button></div>` : '';

  // The row states membership; it does not offer a verb. Ticking is the edit.
  const libItem = (i,kind) => {
    const on   = inSet(i.name);
    const chg  = pend.add.includes(i.name) || pend.rem.includes(i.name);
    const open = s.menu===i.name;
    return `<div class="itemrow" style="${chg?'background:rgba(91,124,250,.06);border-radius:7px':''}">
      <button class="tick ${on?'on':''}" data-act="p:tog:${kind}:${i.name}" role="checkbox" aria-checked="${on}"
        aria-label="${on?'Remove':'Include'} ${esc(i.name)} ${on?'from':'in'} ${esc(name||'the toolset')}" ${name?'':'disabled'}>${on?'✓':''}</button>
      <div class="col" style="flex:1;min-width:0">
        <span class="xs" style="color:var(--text);font-weight:600">${esc(i.name)}
          <span class="dimt" style="font-weight:400">${i.origin==='library'?'your library':'declared by this project'}</span>
          ${chg?`<span class="badge" style="background:rgba(91,124,250,.18);color:var(--blueSoft);margin-left:6px">${pend.add.includes(i.name)?'will be added':'will be removed'}</span>`:''}</span>
        ${i.detail?`<span class="srcline">${esc(i.detail)}</span>`:''}
        ${open?`<div class="box bad col g4 mt6">
          <span class="xs"><b>Delete ${esc(i.name)} from your library?</b> This is your machine-wide library, not this toolset — every project that names it is affected. It moves to the library trash.</span>
          <div class="row g8">${btn('Delete from library…','remove:'+kind+':'+i.name,'dgr')}${btn('Cancel','p:menu:','ghost')}</div></div>`:''}
      </div>
      ${i.origin==='library'?`<button class="link dimt" data-act="p:menu:${i.name}" title="Machine-wide actions for this item" style="text-decoration:none">⋯</button>`:''}</div>`;
  };

  const q=s.query.toLowerCase();
  const match=i=>!q||i.name.toLowerCase().includes(q)||(i.detail||'').toLowerCase().includes(q);
  const group=(title,items,kind)=>{
    const list=items.filter(i=>!s.libRemoved.includes(i.name)).filter(match);
    return `<div class="col g6" style="margin-bottom:10px"><span class="xs" style="color:var(--text);font-weight:600">${title}</span>
      ${list.length===0?`<span class="xs dimt">No ${kind}s match.</span>`:list.map(i=>libItem(i,kind)).join('')}</div>`;
  };

  const canCreate = s.newRow && /^[A-Za-z0-9._-]+$/.test(s.newRow.name.trim()) && pend.add.length>0;
  const bar = s.flow ? flowCard(s) : (count>0 || s.newRow) ? `
    <div style="border-top:1px solid var(--line);padding:10px 14px" class="row g10">
      <span class="xs" style="flex:1">${count===0?'Tick what this toolset should contain.':
        `<b style="color:var(--text)">${pend.add.length?'+'+pend.add.length:''}${pend.add.length&&pend.rem.length?' ':''}${pend.rem.length?'−'+pend.rem.length:''}</b> pending in <b style="color:var(--text)">${esc(name||'')}</b> · one lock, one render`}</span>
      ${s.newRow ? btn(`Create ${esc(s.newRow.name.trim()||'toolset')}`,'p:create','ok',canCreate?'':'disabled')
                 : btn(`Apply ${count} change${count>1?'s':''} to ${esc(name||'')}`,'p:apply','ok')}
      ${count>0?`<button class="link" data-act="p:reset">Reset</button>`:''}
    </div>` : '';

  return `<div class="pane-l">
      <div class="row g8" style="padding:12px 12px 6px"><span class="cap">TOOLSETS</span>
        ${!s.newRow?`<span style="margin-left:auto">${btn('+ New','p:new')}</span>`:''}</div>
      <div class="col g6" style="padding:0 8px 12px">${newRow}${s.toolsets.map(t=>toolsetRow(s,t,{selectable:true})).join('')}</div>
      <div style="padding:0 12px 12px"><span class="srcline">Pick one — the list on the right is its contents.</span></div>
    </div>
    <div class="pane-r">
      <div class="col g4" style="padding:12px 14px 8px">
        <div class="row g8">
          <span class="cap">${name?`WHAT’S IN ${esc(name).toUpperCase()}`:'PICK A TOOLSET'}</span>
          <span style="margin-left:auto;width:170px"><input class="inp" placeholder="Filter…" value="${esc(s.query)}" data-input="query"></span></div>
        <span class="srcline">Ticked means it is in this toolset. Untick to take it out. Nothing is written until you apply.</span>
      </div>
      <div style="padding:0 14px 12px">${group('Skills',LIB.skills,'skill')}${group('Servers',LIB.servers,'server')}</div>
      ${bar}
    </div>`;
}

SCEN.forEach(sc=>{ const g=GUIDE[sc.id]||[];
  sc.steps.forEach((st,i)=>{ const [instr,target,changed]=g[i]||[]; st.instr=instr||null; st.target=target||st.target||null; st.changed=changed||null; }); });

/* flat frame list, for the sheet */
const FLAT = SCEN.flatMap(sc => sc.steps.map((st,i)=>({sc,st,i})));
const TONE_N = {g:'',a:'o',r:'r',b:'b',n:'n'};

/* ══ render ═════════════════════════════════════════════════════════ */
const scenario = () => SCEN.find(s=>s.id===CUR.scenario) || SCEN[0];
const step = () => { const sc=scenario(); return sc.steps[Math.min(CUR.step, sc.steps.length-1)]; };
function stateFor(sc, i){ const s=base(); sc.steps[i].setup(s); return s; }

function renderRail(){

    `<h2>${g}</h2>` + SCEN.filter(s=>s.group===g).map(s=>{

    }).join('')).join('');

function uiFor(s){
  if(s.dialog==='trust')     return viewTrust(s);
  if(s.dialog==='drift')     return viewDrift(s);
  if(s.dialog==='setup')     return viewSetup(s);
  if(s.dialog==='monitor')   return viewMonitor();
  if(s.dialog==='denial')    return viewDenial();
  if(s.dialog==='blueprint') return viewBlueprint();
  if(s.manage)               return viewManage(s);
  return viewGlance(s);
}

/* The step names a component, but you can navigate away from it inside the
   panel — so the header reports what is actually rendered right now. */
function liveComponent(st_, step_){
  if(st_.dialog) return {trust:'TrustReviewPanel',drift:'DriftReviewPanel',setup:'SetupPanel',
    monitor:'WorkflowMonitorDialog',denial:'AgentstackDenialCard',blueprint:'BlueprintReviewCard'}[st_.dialog];
  if(st_.manage) return st_.proposed ? 'proposed · ToolsetsTab' : {setup:'SetupTab',toolsets:'ToolsetsTab + ToolsetRail',
    protection:'ProtectionPanel + SharePanel',activity:'ActivityPanel + WorkflowPanel'}[st_.manage];
  return step_.component;
}

/* Markdown-lite for instruction text: **bold** and `code`. */
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');

/* A step is "done" once you have actually performed it: either you moved
   past it, or it is the last one and its own advance predicate is true. */
function stepDone(sc,i){
  if(i<CUR.step) return true;                       // you moved past it
  if(DID.has(sc.id+':'+i)) return true;             // you performed its own action
  const st=sc.steps[i];
  if(!st.target && !st.advance) return true;        // a read step: nothing to perform
  return !!(st.advance && st.advance(S));
}
function guideBar(sc,st){
  const i=CUR.step, total=sc.steps.length, done=stepDone(sc,i);
  const pct=Math.round(((done?i+1:i)/total)*100);
  const prev = i>0 ? sc.steps[i-1] : null;
  const instr = st.instr || 'Read this state — nothing here advances it.';
  return `<div class="guide ${done?'done':''}">
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="r">
      <span class="n">${done?'✓':i+1}</span>
      <span class="txt">${done ? (st.changed ? md(st.changed) : md(instr)) : md(instr)}</span>
      <span class="of">step ${i+1} of ${total}</span>
      <button class="replay" data-replay="1">${done&&i+1<total?'Next step →':'Replay'}</button>
    </div>
    ${(!done&&prev&&prev.changed&&LASTCHANGE===prev.changed)?
      `<div class="changed">✓ <span>${md(prev.changed)}</span></div>`:''}
  </div>`;
}

      <span class="num ${i<CUR.step?'done':''}">${i<CUR.step?'✓':i+1}</span><span class="lbl">${esc(x.name)}</span></button>`).join('')}</div>
  </header>
  <div class="body">

      ${guideBar(sc,st)}
      <div class="colhead"><span class="k">WHAT YOU SEE</span><span class="v">${st.ui.startsWith('manage')?'Manage · dialog':st.ui==='popover'?'popover · 400px':'dialog'}</span>
        <span class="c">${esc(liveComponent(S, st))}</span></div>

    ${showUi&&showCli?`<div class="gutter" id="gutter" role="separator" aria-orientation="vertical" tabindex="0"
      aria-label="Resize the panel and terminal columns" aria-valuenow="${Math.round(CUR.uiPct)}" aria-valuemin="24" aria-valuemax="76"
      title="Drag to resize · double-click to reset · ← → when focused"></div>`:''}
    ${showCli?`<div class="clicol">
      <div class="colhead"><span class="k">THE SAME THING IN THE CLI</span>
        <span class="c">${c.recon?'<span class="badge a" title="A write command — not executed during the review; output read from the source instead.">reconstructed</span>':'<span class="badge g" title="Captured from ./target/release/agentstack 0.16.0">captured</span>'}</span></div>
      <div class="cliscroll">
        <div class="term-wrap">
          <div class="term-top"><i style="background:#F87171"></i><i style="background:#FBBF24"></i><i style="background:#34D399"></i>
            <span class="cwd">${esc(c.cwd||'~')}</span></div>
          <div class="term"><span class="ps">$</span> <b>${esc(c.cmd)}</b><span class="cursor"></span>

${c.out}</div>
        </div>
        <div class="col g10"><span class="sechead">HOW IT WORKS</span>
          ${st.how.map(h=>`<div class="how"><span class="accent" style="background:${h.a}"></span>

        <div class="col g8"><span class="sechead">GUARANTEES AT THIS STEP</span>
          ${st.gtee.map(([m,t])=>`<div class="gt ${m==='✓'?'yes':'no'}"><span class="m">${m}</span><span class="x2">${esc(t)}</span></div>`).join('')}</div>

function renderSheet(){
  const groups=[...new Set(SCEN.map(s=>s.group))];
  let n=0;
  document.getElementById('main').innerHTML = `<div class="scroller">${groups.map(g=>{
    const items=FLAT.filter(f=>f.sc.group===g);
    return `<h2 class="sheet-h">${g}</h2>

      <div class="sheet">${items.map(f=>{
        const s=stateFor(f.sc,f.i); n++;
        return `<div class="card">

}

  const el=document.getElementById('refq'), q=el?el.value:'';

  document.getElementById('main').innerHTML = `<div class="scroller">
    <div class="refhead"><input id="refq" placeholder="Filter commands…" value="${esc(q)}">
      <span class="xs dimt">${keys.length} of ${Object.keys(CLI).length} · <span class="badge g">captured</span> ran against the real binary · <span class="badge a">reconstructed</span> writes, read from the source instead</span></div>
    ${keys.map(k=>{const c=CLI[k];return `<details class="refitem" ${keys.length<4?'open':''}>
      <summary><span class="cmdname">${esc(c.cmd)}</span><span class="purpose">${esc(c.cwd||'')}</span>
        <span class="flag badge ${c.recon?'a':'g'}">${c.recon?'reconstructed':'captured'}</span></summary>
      <div class="refbody"><div class="term" style="max-height:none">${c.out}</div></div></details>`;}).join('')}</div>`;
  if(q){const i=document.getElementById('refq'); i.focus(); i.setSelectionRange(q.length,q.length);}
}

function render(){
  renderRail();
  if(CUR.mode==='guided') renderGuided();
  else if(CUR.mode==='sheet') renderSheet();
  else renderRef();
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===CUR.mode));
  aim();
}
/* Ring the one control that advances the current step, so the verb is never
   something you have to hunt for among four look-alike buttons. */
function aim(){
  if(CUR.mode!=='guided') return;
  const sc=scenario(), st=step();
  if(!st.target || stepDone(sc,CUR.step)) return;
  const t = typeof st.target==='function' ? st.target(S) : st.target;
  if(!t) return;
  const el=document.querySelector(`.uistage [data-act="${t}"]`);
  if(el) el.classList.add('aim');
}

/* ══ actions — the live state machine ═══════════════════════════════ */
function act(a){
  const [head,...rest]=a.split(':');
  switch(head){
    case 'close': S.dialog=null; S.manage=null; S.picker=null; S.popover=true; break;
    case 'noop': break;
    case 'recheck': S.loaded=true; S.doctorNull=false; S.reachable=true; break;
    case 'manage': S.dialog=null; S.manage=rest[0]; break;
    case 'open':   S.dialog=rest[0]; break;
    case 'concern':{
      const c=concern(S); if(!c) break;
      if(c.act==='review-trust') S.dialog='trust';
      else if(c.act==='review-drift') S.dialog='drift';
      else S.action={kind:c.act.split(':')[1],phase:'confirm'};
      break;}
    case 'act':
      if(rest[0]==='start') S.action={kind:rest[1],phase:'confirm'};
      if(rest[0]==='cancel'||rest[0]==='dismiss') S.action=null;
      if(rest[0]==='run'){
        const k=S.action.kind;
        S.action={kind:k,phase:'done',ok:true,message:ACTION_META[k].done};
        if(k==='guard-install') S.guard=true;
        if(k==='adopt-project'||k==='apply-project') S.drift=false;
      }
      break;
    case 'trust':
      if(rest[0]==='grant'){S.trust='trusted';S.trustAct={ok:true,message:'trusted /Users/tarek.k/GitHub/checkout at sha256:3f9a…c0'};}
      if(rest[0]==='revoke'){S.trust='inert';S.trustAct={ok:true,message:'revoked — this project is inert again'};}
      break;
    case 'drift':
      S.drift=false;
      S.driftAct={ok:true,message: rest[0]==='adopt'?'adopted 2 changes into .agentstack/agentstack.toml':'re-rendered 1 target from the manifest'};
      break;
    case 'setup':
      if(rest[0]==='choice') S.secretChoice=+rest[1];
      if(rest[0]==='apply'){S.setupAct={ok:true,message:'wrote .agentstack/agentstack.toml · 11 server(s) imported'};S.setupState='ready';}
      break;
    case 'use':  S.session={profile:rest[0],ago:'just now'}; break;
    case 'stop': S.session=null; break;
    case 'draft':
      if(rest[0]==='new') S.draft={name:'',picked:[]};
      if(rest[0]==='cancel') S.draft=null;
      if(rest[0]==='pick'){const n=rest[1],p=S.draft.picked; S.draft.picked=p.includes(n)?p.filter(x=>x!==n):p.concat(n);}
      if(rest[0]==='create'){
        S.toolsets=S.toolsets.concat([{name:S.draft.name.trim(),ready:true,blocked:null,targets:'claude-code',members:S.draft.picked.slice()}]);
        S.draft=null; S.created=true;
      }
      break;
    case 'sel': S.sel=rest[0]; S.newRow=null; S.menu=null; S.pending={add:[],rem:[]}; break;
    case 'p':{
      const [op,...r]=rest;
      const reset=()=>{S.pending={add:[],rem:[]}};
      if(op==='new'){ S.newRow={name:'',members:[],ready:true,blocked:null,targets:'claude-code'}; S.menu=null; reset(); }
      if(op==='cancel'){ S.newRow=null; reset(); }
      if(op==='menu')  S.menu = r[0]||null;
      if(op==='reset') reset();
      if(op==='tog'){
        const [,n]=r; S.menu=null;
        const t = S.newRow || S.toolsets.find(x=>x.name===S.sel); if(!t) break;
        const P=S.pending, inBase=t.members.includes(n);
        if(inBase) P.rem = P.rem.includes(n) ? P.rem.filter(x=>x!==n) : P.rem.concat(n);
        else       P.add = P.add.includes(n) ? P.add.filter(x=>x!==n) : P.add.concat(n);
      }
      if(op==='apply'){
        const t=S.toolsets.find(x=>x.name===S.sel), P=S.pending;
        const bits=[]; if(P.add.length) bits.push('+'+P.add.length); if(P.rem.length) bits.push('−'+P.rem.length);
        S.flow={kind:'batch',title:`Update toolset "${t.name}" — ${bits.join(' ')}`,phase:'confirm',
                secret:P.add.includes('github')||P.add.includes('postgres'), add:P.add.slice(), rem:P.rem.slice()};
      }
      if(op==='create'){
        const m=S.pending.add.slice();
        S.toolsets=S.toolsets.concat([{...S.newRow,members:m}]);
        S.sel=S.newRow.name; S.newRow=null; S.created=true; reset();
      }
      break;}
    case 'picker': S.picker = rest[0]==='close'?null:rest[0]; break;
    case 'add':{ const [kind,name,target]=rest; S.picker=null;
      S.flow={kind:'add',title:`Add ${kind} "${name}" to toolset "${target}"`,phase:'confirm',secret:kind==='server'}; break;}
    case 'remove': S.flow={kind:'remove',name:rest[1],title:`Remove ${rest[0]} "${rest[1]}" from your library`,phase:'confirm'}; break;
    case 'flow':
      if(rest[0]==='close') S.flow=null;
      if(rest[0]==='confirm'){
        const f=S.flow, t=S.toolsets.find(x=>x.name===S.sel);
        if(f.kind==='batch'){
          if(f.secret) S.flow={...f,phase:'done',ok:false,secretBlocked:true};
          else {
            t.members = t.members.filter(x=>!f.rem.includes(x)).concat(f.add);
            S.pending={add:[],rem:[]};
            S.flow={...f,phase:'done',ok:true,message:`re-locked once and re-rendered ${t.name} across 4 target(s)`};
          }
        }
        else if(f.kind==='remove'){ S.libRemoved.push(f.name); S.flow={...f,phase:'done',ok:true,message:`moved "${f.name}" to the library trash`}; }
        else if(f.kind==='unadd'){ t.members=t.members.filter(x=>x!==f.member);
          S.flow={...f,phase:'done',ok:true,message:`re-locked and re-rendered ${t.name}`}; }
        else if(f.secret) S.flow={...f,phase:'done',ok:false,secretBlocked:true};
        else { if(f.member&&t&&!t.members.includes(f.member)) t.members=t.members.concat(f.member);
          S.flow={...f,phase:'done',ok:true,message:'re-locked agentstack.lock and re-rendered 4 target(s)'}; }
      }
      break;
    case 'undo':
      if(rest[0]==='reveal') S.undo={phase:'ready'};
      if(rest[0]==='ask')    S.undo={phase:'confirm'};
      if(rest[0]==='cancel') S.undo={phase:'ready'};
      if(rest[0]==='run')    S.undo={phase:'done'};
      break;
  }
  // a step advances by having actually been performed, not by switching a slide
  const sc=scenario(), i=CUR.step, st=sc.steps[i];
  const tgt = st && (typeof st.target==='function' ? st.target(S) : st.target);
  if(tgt===a) DID.add(sc.id+':'+i);
  if(st && st.advance && st.advance(S) && i+1<sc.steps.length){
    LASTCHANGE=st.changed; CUR.step=i+1;
    // Most steps continue from the state you just produced. A step marked
    // `fresh` starts from a different one — it is a second case, not a
    // continuation — so rebuild it rather than leaving the last result up.
    const next=sc.steps[i+1];
    if(next.fresh){ DID.delete(sc.id+':'+(i+1)); S=stateFor(sc,i+1); }
  }
  render();
}

function gotoStep(scenarioId, i){
  CUR.scenario=scenarioId; CUR.step=i; LASTCHANGE=null;
  // Entering a step un-does it and everything after it: the state was just
  // rebuilt from setup(), so anything you performed earlier no longer holds.
  [...DID].forEach(k=>{ const [id,n]=k.split(':'); if(id===scenarioId && +n>=i) DID.delete(k); });
  S = stateFor(scenario(), i);
  render();
}

/* ── events ──────────────────────────────────────────────────────── */
document.addEventListener('click', e=>{
  const m=e.target.closest('[data-mode]');   if(m){ CUR.mode=m.dataset.mode; render(); return; }
  const sc=e.target.closest('[data-scen]');  if(sc){ gotoStep(sc.dataset.scen,0); return; }
  const stp=e.target.closest('[data-step]'); if(stp){ gotoStep(CUR.scenario, +stp.dataset.step); return; }
  const v=e.target.closest('[data-view]');   if(v){ CUR.view=v.dataset.view; render(); return; }
  if(e.target.closest('[data-replay]')){
    const sc=scenario(), i=CUR.step;
    gotoStep(sc.id, (stepDone(sc,i)&&i+1<sc.steps.length) ? i+1 : i);
    return;
  }
  const a=e.target.closest('[data-act]');
  if(a && !a.closest('.frozen') && !a.hasAttribute('disabled')) act(a.dataset.act);
});
document.addEventListener('input', e=>{
  if(e.target.id==='refq'){ renderRef(); return; }
  const k=e.target.dataset.input;
  if(!k) return;
  const pos=e.target.selectionStart;
  if(k==='draftname'&&S.draft) S.draft.name=e.target.value;
  if(k==='newname'&&S.newRow) S.newRow.name=e.target.value;
  if(k==='query') S.query=e.target.value;
  render();
  const el=document.querySelector(`[data-input="${k}"]`);
  if(el){ el.focus(); el.setSelectionRange(pos,pos); }
});
/* ── column resize ──────────────────────────────────────────────────
   The columns are re-rendered wholesale on every state change, so the drag
   writes the width straight to the node and only stores the percentage —
   re-rendering on each pointermove would rebuild both panes 60 times a
   second and drop the drag. */
const UI_MIN=24, UI_MAX=76, UI_DEFAULT=46;
function setUiPct(pct){
  CUR.uiPct = Math.min(UI_MAX, Math.max(UI_MIN, pct));
  const col=document.getElementById('uicol'), g=document.getElementById('gutter');
  if(col) col.style.width = CUR.uiPct+'%';
  if(g) g.setAttribute('aria-valuenow', Math.round(CUR.uiPct));
}
document.addEventListener('pointerdown', e=>{
  const g=e.target.closest('#gutter'); if(!g) return;
  const body=g.parentElement.getBoundingClientRect();
  if(body.width<=0) return;
  g.classList.add('dragging'); document.body.classList.add('resizing');
  g.setPointerCapture(e.pointerId);
  const move = ev => setUiPct(((ev.clientX-body.left)/body.width)*100);
  const up = () => {
    g.classList.remove('dragging'); document.body.classList.remove('resizing');
    g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up);
    g.removeEventListener('pointercancel',up);
  };
  g.addEventListener('pointermove',move); g.addEventListener('pointerup',up);
  g.addEventListener('pointercancel',up);
  e.preventDefault();
});
document.addEventListener('dblclick', e=>{ if(e.target.closest('#gutter')) setUiPct(UI_DEFAULT); });

document.addEventListener('keydown', e=>{
  if(e.target.id==='gutter'){
    if(e.key==='ArrowLeft')  { setUiPct(CUR.uiPct-2); e.preventDefault(); }
    if(e.key==='ArrowRight') { setUiPct(CUR.uiPct+2); e.preventDefault(); }
    if(e.key==='Home')       { setUiPct(UI_DEFAULT); e.preventDefault(); }
    return;
  }
  if(e.target.tagName==='INPUT') return;
  const sc=scenario();
  if(e.key==='ArrowRight') gotoStep(sc.id, Math.min(CUR.step+1, sc.steps.length-1));
  if(e.key==='ArrowLeft')  gotoStep(sc.id, Math.max(CUR.step-1, 0));
});

gotoStep('ready',0);
</script>
