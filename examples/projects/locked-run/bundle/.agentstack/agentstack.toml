version = 1

# Two stdio servers, both with executables pinned by `agentstack lock` (D3).
# The `ci` toolset is a FENCE under `--locked --toolset ci`: the gates, the
# frozen grant, and the bridge all see only this subset — no native session
# state is applied.

[servers.opsbox]
type = "stdio"
command = "./opsbox.sh"

[servers.scratchpad]
type = "stdio"
command = "./scratchpad.sh"

[toolsets.ci]
servers = ["opsbox"]
