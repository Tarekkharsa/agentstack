[workspace]
resolver = "2"
members = ["crates/core", "crates/trust", "crates/policy", "crates/adapters", "crates/recorder", "crates/runtime", "crates/egress", "crates/executor", "crates/workflow", "crates/mcp", "crates/cli"]

# Fields shared by every crate. Members inherit with `edition.workspace = true`
# etc., so a toolchain bump is one edit here, not nine.
[workspace.package]
edition = "2021"
# The oldest toolchain this workspace actually builds on, verified by CI's
# `msrv` job. It is NOT a preference: `boa_engine` (the workflow interpreter)
# declares 1.88, and several transitive crates need edition-2024 Cargo, so
# anything lower fails to resolve. It said 1.80 until 2026-07-28, which was a
# claim nobody had checked — the same class of error the enforcement docs exist
# to prevent, applied to the build instead of to security.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tarekkharsa/agentstack"

# Workspace-wide lints, inherited by each member via `[lints] workspace = true`.
# This is where the panic-discipline the codebase already keeps by convention
# (18 production unwraps in ~55k lines, all provably safe) becomes MACHINE-
# enforced: `unwrap_used` is a clippy restriction lint (allow-by-default), and
# denying it means a bare `.unwrap()` in non-test code fails the build. Test
# code is exempted in `clippy.toml` (`allow-unwrap-in-tests`), and `.expect(
# "why this holds")` — the house style for a genuine invariant — is untouched.
[workspace.lints.clippy]
unwrap_used = "deny"
# A stray debugging panic must never ship in a security tool.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Profiles only take effect at the workspace root.
[profile.release]
strip = true
# Fat LTO across one codegen unit: this is a short-lived CLI, so link time is
# paid by CI once and every run is faster for it.
lto = "fat"
codegen-units = 1
# `panic = "abort"` is FORBIDDEN here. Four production sites catch a Boa engine
# panic to keep the interpreter's failures contained instead of taking the
# process down (`crates/workflow/src/lib.rs:470,723` and
# `crates/cli/src/commands/workflow.rs:1116,1828`). Aborting on panic deletes
# `catch_unwind`, so the containment invariant would silently stop holding.

# Boa is the workflow interpreter: unoptimized it dominates dev and test wall
# time, and it is a third-party dependency this workspace never steps through
# in a debugger. Optimizing just these packages leaves our own crates fully
# debuggable.
#
# `boa_parser` is deliberately NOT in this list. At opt-level 3 under an
# otherwise unoptimized dev/test build, its recursive-descent frames grow past
# what a test thread's stack holds, and
# `meta::tests::pathologically_nested_meta_is_refused_at_the_bound` — the guard
# proving deeply nested `meta` is refused rather than crashing — aborts on
# stack overflow instead of refusing. That test is the whole point of the
# bound, so the parser stays unoptimized here. `profile.release` optimizes it
# as before; the test passes there, because the calling crate is optimized too.
[profile.dev.package.boa_engine]
opt-level = 3

[profile.dev.package.boa_gc]
opt-level = 3

[profile.dev.package.boa_interner]
opt-level = 3
