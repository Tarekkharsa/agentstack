[package]
name = "agentstack-mcp"
version = "0.18.0-rc.3"
edition.workspace = true
rust-version.workspace = true
description = "Internal MCP protocol adapter for AgentStack"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
process-wrap = { version = "9.1", features = ["tokio1"] }
rmcp = { version = "=3.1.2", default-features = false, features = [
  "client",
  "server",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-service = "0.3"

[dev-dependencies]
tiny_http = "0.12"

[lints]
workspace = true
