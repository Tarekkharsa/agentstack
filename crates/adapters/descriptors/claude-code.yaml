# Claude Code adapter descriptor
# Config: ~/.claude.json — top-level "mcpServers" object, JSON.
# HTTP servers require "type":"http"; headers live in a "headers" object.
id: claude-code
display: Claude Code
detect:
  bin: claude
  config: ~/.claude.json
config:
  path: ~/.claude.json
  format: json
# Project scope: Claude Code reads project MCP servers from .mcp.json and
# project skills from .claude/skills/ at the repo root.
project:
  config: .mcp.json
  format: json
mcp:
  location: mcpServers
  fields:
    url: url
    headers: headers
    command: command
    args: args
    env: env
  # Claude tags every server with a transport "type": "http" or "stdio".
  transport:
    key: type
    http_value: http
    stdio_value: stdio
  headers_as_subtable: false
  secret_mode: literal
skills:
  dir: ~/.claude/skills
  project_dir: .claude/skills
  strategy: symlink
# Headless (prompt-in/text-out) invocation for `run --locked --prompt`:
# `claude -p -- "<prompt>"`. "{prompt}" is replaced as a WHOLE argv element —
# never spliced into another token, never passed through a shell. The literal
# "--" before it is required: it makes Claude Code treat the prompt as a
# positional, so a hostile leading-dash prompt (e.g. "--dangerously-skip-
# permissions") can never be parsed as a flag.
headless:
  args: ["-p", "--", "{prompt}"]
  # Per-launch MODEL selection: `claude -p --model <model> -- "<prompt>"`. The
  # fragment is spliced into the options region before the "--" guard, exactly
  # like mcp_injection, and "{model}" is substituted only AFTER the value has
  # been checked against this adapter's own settings catalog (settings.model_key
  # below → the `model` field, a free-form string, so the conservative charset
  # bound applies).
  model_selection:
    args: ["--model", "{model}"]
  # NO effort_selection, deliberately. Claude Code HAS the notion — settings.
  # effortLevel below — but no CONFIRMED per-launch flag applies it to a single
  # headless run, and the only other route (writing effortLevel into the user's
  # ~/.claude/settings.json) is persistent machine state a governed child run
  # must never touch. Unconfirmed is never used as though it worked; the
  # launcher and `workflow explain` say so out loud instead.
  # Per-child MCP config injection (W2.5): the launcher renders a config file
  # containing ONLY the agentstack gateway entry into the run's private dir and
  # substitutes its path for "{mcp_config_path}" (a WHOLE argv element, spliced
  # into the options region before the "--" guard). --strict-mcp-config is
  # LOAD-BEARING: without it Claude Code MERGES the injected file with the
  # project .mcp.json and user-scope servers; with it the child sees the
  # injected set and nothing else — which is what lets concurrent locked runs
  # share one project without touching the shared .mcp.json.
  mcp_injection:
    args: ["--mcp-config", "{mcp_config_path}", "--strict-mcp-config"]
instructions:
  global: ~/.claude/CLAUDE.md
  project: CLAUDE.md
  # The one CONFIRMED live instruction channel among the registered adapters:
  # MCP's `initialize` result carries a purpose-built `instructions` string,
  # and Claude Code was observed surfacing agentstack's own gateway text to the
  # agent as an MCP-server instruction block. House rules still render to the
  # file above — a channel that cannot know the model and fires before any
  # toolset is leased cannot carry a per-(CLI, model) variant
  # (docs/design/instruction-variants.md).
  live:
    channel: mcp-instructions
    display: MCP initialize instructions
    confirmation: confirmed
    note: >-
      Observed live 2026-08-02 — the gateway's own initialize `instructions`
      reached the agent (docs/design/research/dynamic-instructions-2026-08.md).
# Native settings file: permissions, hooks, feature flags. Separate from the
# MCP config (~/.claude.json); agentstack owns only the top-level keys you
# declare under [settings.claude-code] and leaves the rest untouched.
# Lifecycle hooks live under the "hooks" key of settings.json. agentstack owns
# that whole key when you declare any [hooks.*]; declare none and it's left/pruned.
hooks:
  format: json
  global: ~/.claude/settings.json
  project: .claude/settings.json
  key: hooks
  shape: claude
settings:
  format: json
  global: ~/.claude/settings.json
  project: .claude/settings.json
  # Which catalog field carries "which model" and "how much reasoning effort".
  # These are POINTERS into `fields` below (the descriptor fails to parse if a
  # key names no field there): the catalog already documents each setting's
  # type and legal values, so a per-role model/effort value is checked against
  # it rather than against a second, drift-prone list.
  model_key: model
  effort_key: effortLevel
  # Curated catalog of common, user-facing settings (verified against the
  # official settings.json reference). Enterprise "managed only" keys and
  # complex object settings (hooks, statusLine) are intentionally omitted; any
  # key not listed here is still preserved and can be hand-edited.
  fields:
    - { key: model, type: string, group: General, label: Model, help: "Override the default model (alias or id)." }
    - { key: language, type: string, group: General, label: Language, help: "Preferred response language code." }
    - { key: outputStyle, type: string, group: General, label: Output style, help: "Output style that adjusts the system prompt." }
    - { key: editorMode, type: enum, options: [normal, vim], group: General, label: Editor mode }
    - { key: tui, type: enum, options: [auto, classic, fancy], group: General, label: Terminal UI }
    - { key: effortLevel, type: enum, options: [low, medium, high, xhigh], group: General, label: Effort level, help: "Persist reasoning effort across sessions." }
    - { key: alwaysThinkingEnabled, type: bool, group: General, label: Always extended thinking }
    - { key: autoCompactEnabled, type: bool, default: true, group: General, label: Auto-compact context }
    - { key: spinnerTipsEnabled, type: bool, default: true, group: General, label: Spinner tips }
    - { key: telemetryEnabled, type: bool, default: true, group: General, label: Send usage telemetry }
    - { key: "permissions.defaultMode", type: enum, options: [ask, auto, limited], group: Permissions, label: Default permission mode }
    - { key: "permissions.disableBypassPermissionsMode", type: bool, group: Permissions, label: Lock out of limited mode }
    - { key: includeCoAuthoredBy, type: bool, default: true, group: Git, label: Co-authored-by in commits }
    - { key: includeGitInstructions, type: bool, default: true, group: Git, label: Built-in git instructions }
    - { key: enableAllProjectMcpServers, type: bool, group: MCP, label: Auto-approve project MCP servers }
    - { key: disableClaudeAiConnectors, type: bool, group: MCP, label: Disable claude.ai connectors }
    - { key: autoMemoryEnabled, type: bool, default: true, group: Memory & files, label: Auto memory }
    - { key: fileCheckpointingEnabled, type: bool, default: true, group: Memory & files, label: File checkpointing (/rewind) }
    - { key: respectGitignore, type: bool, default: true, group: Memory & files, label: "@-picker respects .gitignore" }
    - { key: cleanupPeriodDays, type: number, default: 30, group: Memory & files, label: Session cleanup period (days) }
    - { key: autoUpdatesChannel, type: enum, options: [stable, latest], group: Updates, label: Update channel }
    - { key: disableBundledSkills, type: bool, group: Skills, label: Disable bundled skills }
    - { key: disableWorkflows, type: bool, default: false, group: Skills, label: Disable workflows }
    - { key: prefersReducedMotion, type: bool, group: Accessibility, label: Reduce motion }
    - { key: axScreenReader, type: bool, group: Accessibility, label: Screen-reader output }
